---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: byothosts.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1alpha1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: ByotHost
    listKind: ByotHostList
    plural: byothosts
    shortNames:
      - byothosts
    singular: byothost
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Host phase
          jsonPath: .status.phase
          name: Phase
          type: string
        - description: Public IP of the host
          jsonPath: .spec.publicIP
          name: PublicIP
          type: string
        - description: Discovered Talos version
          jsonPath: .status.talosVersion
          name: Talos
          type: string
        - description: Discovered architecture
          jsonPath: .status.arch
          name: Arch
          type: string
        - description: ByotMachine claiming the host
          jsonPath: .status.claimRef.name
          name: Claimed
          type: string
        - description: Discovered GPU model family
          jsonPath: .status.hardware.gpus.model
          name: GPUs
          type: string
        - description: Failure domain
          jsonPath: .spec.failureDomain
          name: FailureDomain
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            ByotHost is the Schema for the byothosts API. It is a manually-added,
            IP-only record of a Talos host sitting in maintenance mode. The controller
            discovers hardware features from the Talos maintenance API and probes
            liveness periodically; ByotMachine objects claim hosts from the registry.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                ByotHostSpec defines the desired state of ByotHost. Operators add a host as
                an IP-only record; the controller discovers features and probes liveness.
              properties:
                failureDomain:
                  description: |-
                    FailureDomain is the operator-set physical failure domain, promoted to
                    the byot.io/failure-domain label so claim selectors can match it.
                  type: string
                publicIP:
                  description: |-
                    PublicIP is the immutable identity of the host. It must be reachable on
                    the Talos machine API port (50000) in maintenance mode.
                  minLength: 1
                  type: string
                  x-kubernetes-validations:
                    - message: publicIP is immutable
                      rule: self == oldSelf
              required:
                - publicIP
              type: object
            status:
              description: ByotHostStatus defines the observed state of ByotHost.
              properties:
                arch:
                  description: Arch is the discovered architecture (from the Version RPC).
                  type: string
                claimRef:
                  description: ClaimRef is set when a ByotMachine has claimed this host.
                  properties:
                    kind:
                      description: Kind of the referent.
                      type: string
                    name:
                      description: Name of the referent.
                      type: string
                    namespace:
                      description: Namespace of the referent.
                      type: string
                    uid:
                      description: UID of the referent (the ByotMachine's UID).
                      type: string
                  required:
                    - kind
                    - name
                    - namespace
                    - uid
                  type: object
                conditions:
                  description: Conditions defines current service state of the ByotHost.
                  items:
                    description: Condition defines an observation of a Cluster API resource operational state.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed. If that is not known, then using the time when
                          the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This field may be empty.
                        maxLength: 10240
                        minLength: 1
                        type: string
                      reason:
                        description: |-
                          reason is the reason for the condition's last transition in CamelCase.
                          The specific API may choose whether or not this field is considered a guaranteed API.
                          This field may be empty.
                        maxLength: 256
                        minLength: 1
                        type: string
                      severity:
                        description: |-
                          severity provides an explicit classification of Reason code, so the users or machines can immediately
                          understand the current situation and act accordingly.
                          The Severity field MUST be set only when Status=False.
                        maxLength: 32
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: |-
                          type of condition in CamelCase or in foo.example.com/CamelCase.
                          Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                          can be useful (see .node.status.conditions), the ability to deconflict is important.
                        maxLength: 256
                        minLength: 1
                        type: string
                    required:
                      - lastTransitionTime
                      - status
                      - type
                    type: object
                  type: array
                hardware:
                  description: Hardware holds the discovered hardware features (view-only).
                  properties:
                    cpu:
                      description: CPU is the discovered CPU topology.
                      properties:
                        cores:
                          description: Cores is the total number of logical CPUs (nr_cpu_ids).
                          format: int32
                          type: integer
                        numaNodes:
                          description: NumaNodes is the number of NUMA nodes.
                          format: int32
                          type: integer
                        packages:
                          description: Packages is the number of physical CPU packages.
                          format: int32
                          type: integer
                      required:
                        - cores
                        - numaNodes
                        - packages
                      type: object
                    disks:
                      description: Disks is the discovered disk inventory.
                      items:
                        description: HostDisk holds a discovered disk from the Talos Disks RPC.
                        properties:
                          busPath:
                            description: BusPath is the PCI/bus path, when available.
                            type: string
                          model:
                            description: Model is the disk model string, when available.
                            type: string
                          name:
                            description: Name is the device path, e.g. "/dev/sda".
                            type: string
                          size:
                            anyOf:
                              - type: integer
                              - type: string
                            description: Size is the disk capacity as a resource.Quantity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          systemDisk:
                            description: SystemDisk is true for the Talos system disk.
                            type: boolean
                          type:
                            description: 'Type is the disk type: NVME, SSD, HDD, SD.'
                            type: string
                        required:
                          - name
                          - size
                          - type
                        type: object
                      type: array
                    gpus:
                      description: |-
                        GPUs is the discovered GPU summary (count, vendor, model, memory).
                        Nil when no GPU is present. Mixed models collapse to count+vendor only.
                      properties:
                        count:
                          description: |-
                            Count is the number of discovered GPUs (display-class PCI devices from
                            a known vendor).
                          format: int32
                          type: integer
                        deviceId:
                          description: |-
                            DeviceID is the raw PCI device id (e.g. "2331") for triage of unknown
                            devices. Empty for mixed hosts (no single id to report).
                          type: string
                        memoryPerGPU:
                          anyOf:
                            - type: integer
                            - type: string
                          description: |-
                            MemoryPerGPU is the per-GPU HBM as a resource.Quantity, derived from the
                            model table (not measured). Zero when the model is unknown or mixed.
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        mixed:
                          description: |-
                            Mixed is true when the host has GPUs of more than one vendor:device pair.
                            Model and DeviceID are empty in that case.
                          type: boolean
                        model:
                          description: |-
                            Model is the normalized model family (e.g. "h100-pcie", "b300-sxm6"),
                            from the PCI device-id table. Empty for unknown devices or mixed hosts.
                          type: string
                        totalMemory:
                          anyOf:
                            - type: integer
                            - type: string
                          description: |-
                            TotalMemory is Count times MemoryPerGPU. Zero when the model is unknown
                            or mixed.
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        vendor:
                          description: |-
                            Vendor is the lowercase GPU vendor (nvidia, amd, intel). Omitted when
                            the host has GPUs from more than one vendor.
                          type: string
                      required:
                        - count
                        - memoryPerGPU
                        - totalMemory
                      type: object
                    memory:
                      anyOf:
                        - type: integer
                        - type: string
                      description: Memory is the total memory as a resource.Quantity (from Meminfo.Memtotal).
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    networkInterfaces:
                      description: |-
                        NetworkInterfaces lists interface names from /sys/class/net. Per-
                        interface MACs are not collected here; the first-up NIC MAC used for
                        machine identity is in status.identity.hardwareAddr.
                      items:
                        type: string
                      type: array
                  required:
                    - cpu
                    - memory
                  type: object
                identity:
                  description: |-
                    Identity holds the reboot-stable hardware identity (SMBIOS UUID + first
                    NIC MAC) used to verify the host is the same physical board across
                    reboots/upgrades. Populated by discovery; empty when the firmware or NIC
                    exposes nothing usable.
                  properties:
                    hardwareAddr:
                      description: |-
                        HardwareAddr is the colon-separated MAC of the first-up physical NIC
                        (the address Talos uses for machine identity), from the network.HardwareAddr
                        resource. Spoofable from userspace and zero on some virtual NICs, so it is
                        a cross-check rather than a primary identity.
                      type: string
                    manufacturer:
                      description: |-
                        Manufacturer is the SMBIOS Type 1 manufacturer string. Empty when
                        unavailable.
                      type: string
                    productName:
                      description: ProductName is the SMBIOS Type 1 product name. Empty when unavailable.
                      type: string
                    serialNumber:
                      description: |-
                        SerialNumber is the SMBIOS Type 1 board serial number, kept as an
                        additional cross-check. Empty when unavailable.
                      type: string
                    systemUUID:
                      description: |-
                        SystemUUID is the SMBIOS Type 1 UUID (firmware-burned, survives Talos
                        upgrades and reinstalls). Empty when the firmware does not expose one.
                      type: string
                  type: object
                lastProbedAt:
                  description: LastProbedAt records when the host was last probed.
                  format: date-time
                  type: string
                maintenanceMode:
                  description: |-
                    MaintenanceMode is the last maintenance-liveness probe result.
                    Absent (the default before the first probe completes) is equivalent to
                    false: the host is not confirmed in maintenance mode.
                  type: boolean
                phase:
                  description: Phase is the current lifecycle phase.
                  type: string
                platform:
                  description: |-
                    Platform is the discovered Talos platform (from the kernel cmdline
                    talos.platform= in dmesg).
                  type: string
                probeFailureCount:
                  description: |-
                    ProbeFailureCount is the number of consecutive maintenance probe
                    failures. Reset on success.
                  format: int32
                  type: integer
                talosVersion:
                  description: TalosVersion is the discovered Talos version (from the Version RPC).
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
