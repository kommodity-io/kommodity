---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: byotmachines.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1alpha1
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: ByotMachine
    listKind: ByotMachineList
    plural: byotmachines
    singular: byotmachine
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Cluster
          jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
          name: Cluster
          type: string
        - description: Machine object which owns this ByotMachine
          jsonPath: .metadata.ownerReferences[?(@.kind=="Machine")].name
          name: Machine
          type: string
        - description: Public IP of the adopted machine
          jsonPath: .spec.publicIP
          name: PublicIP
          type: string
        - description: Machine adopted
          jsonPath: .status.ready
          name: Ready
          type: boolean
        - description: Provider ID of the adopted machine
          jsonPath: .spec.providerID
          name: ProviderID
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            ByotMachine is the Schema for the byotmachines API. It adopts an existing
            Talos machine running in maintenance mode, identified by public IP, by
            applying the cluster's bootstrap machine configuration over the Talos
            machine API.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: ByotMachineSpec defines the desired state of ByotMachine.
              properties:
                failureDomain:
                  description: FailureDomain is the unique name of the failure domain the machine is placed in.
                  type: string
                providerID:
                  description: ProviderID is set by the controller once the machine has been adopted.
                  type: string
                publicIP:
                  description: |-
                    PublicIP identifies the machine to adopt. It must be reachable on the
                    Talos machine API port (50000) in maintenance mode.
                  minLength: 1
                  type: string
                  x-kubernetes-validations:
                    - message: publicIP is immutable
                      rule: self == oldSelf
              required:
                - publicIP
              type: object
            status:
              description: ByotMachineStatus defines the observed state of ByotMachine.
              properties:
                addresses:
                  description: Addresses contains the machine's addresses.
                  items:
                    description: MachineAddress contains information for the node's address.
                    properties:
                      address:
                        description: address is the machine address.
                        maxLength: 256
                        minLength: 1
                        type: string
                      type:
                        description: type is the machine address type, one of Hostname, ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                        enum:
                          - Hostname
                          - ExternalIP
                          - InternalIP
                          - ExternalDNS
                          - InternalDNS
                        type: string
                    required:
                      - address
                      - type
                    type: object
                  type: array
                conditions:
                  description: Conditions defines current service state of the ByotMachine.
                  items:
                    description: Condition defines an observation of a Cluster API resource operational state.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed. If that is not known, then using the time when
                          the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This field may be empty.
                        maxLength: 10240
                        minLength: 1
                        type: string
                      reason:
                        description: |-
                          reason is the reason for the condition's last transition in CamelCase.
                          The specific API may choose whether or not this field is considered a guaranteed API.
                          This field may be empty.
                        maxLength: 256
                        minLength: 1
                        type: string
                      severity:
                        description: |-
                          severity provides an explicit classification of Reason code, so the users or machines can immediately
                          understand the current situation and act accordingly.
                          The Severity field MUST be set only when Status=False.
                        maxLength: 32
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: |-
                          type of condition in CamelCase or in foo.example.com/CamelCase.
                          Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                          can be useful (see .node.status.conditions), the ability to deconflict is important.
                        maxLength: 256
                        minLength: 1
                        type: string
                    required:
                      - lastTransitionTime
                      - status
                      - type
                    type: object
                  type: array
                ready:
                  description: |-
                    Ready denotes that the machine has been adopted: the machine
                    configuration was applied successfully over the Talos maintenance API.
                  type: boolean
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
