{{/*
Render a single v1/Secret manifest from an extra secret spec.

Shared by both CRS and inline manifest delivery paths so the manifest
content is identical regardless of delivery channel. Performs the
data + stringData mutual exclusion validation.

Usage: {{ include "kommodity.extraSecrets.manifest" (dict "secret" $secret "secretName" $secretName "namespace" $namespace "release" $.Release.Name) }}
*/}}
{{- define "kommodity.extraSecrets.manifest" -}}
{{- $type := (default "Opaque" .secret.type) -}}
{{- $hasData := .secret.data -}}
{{- $hasStringData := .secret.stringData -}}
{{- if and $hasData $hasStringData -}}
{{- fail (printf "Secret '%s' in namespace '%s' cannot have both 'data' and 'stringData' defined" .secretName .namespace) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .secretName }}
  namespace: {{ .namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ .release }}
    app.kubernetes.io/managed-by: kommodity
    {{- with .secret.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: {{ $type }}
{{- if $hasData }}
data:
{{- range $key, $value := .secret.data }}
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
{{- else if $hasStringData }}
stringData:
{{- range $key, $value := .secret.stringData }}
  {{ $key }}: {{ $value }}
{{- end }}
{{- end }}
{{- end -}}
{{- $extraSecrets := .Values.kommodity.extraSecrets }}
{{- $hasCRSSecret := false -}}
{{- range $namespace, $secrets := $extraSecrets -}}
{{- range $secretName, $secret := $secrets -}}
{{- if ne (default "CRS" $secret.delivery) "InlineManifest" -}}
{{- $hasCRSSecret = true -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $extraSecrets $hasCRSSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-kommodity-extra-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: kommodity
type: addons.cluster.x-k8s.io/resource-set
stringData:
{{- range $namespace, $secrets := $extraSecrets }}
{{- range $secretName, $secret := $secrets }}
{{- if ne (default "CRS" $secret.delivery) "InlineManifest" }}
{{- $secretNamespaceName := printf "%s-%s" $namespace $secretName }}
  {{ $secretNamespaceName }}: |
{{ include "kommodity.extraSecrets.manifest" (dict "secret" $secret "secretName" $secretName "namespace" $namespace "release" $.Release.Name) | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: {{ .Release.Name }}-extra-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kommodity
    cluster.x-k8s.io/cluster-name: {{ .Release.Name }}
spec:
  strategy: Reconcile
  clusterSelector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ .Release.Name }}
  resources:
    - kind: Secret
      name: {{ .Release.Name }}-kommodity-extra-secrets
{{- end }}
