{{- /* TalosConfigTemplate renders for all providers including byot, which
       now uses TalosControlPlane + MachineDeployment like every other provider. */ -}}
{{- range $name, $np := .Values.kommodity.nodepools }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: {{ $.Release.Name }}-worker-{{ $name }}-{{ include "kommodity-cluster.talosConfigHash" (dict "poolValues" $np "allValues" $.Values) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kommodity
spec:
  template:
    spec:
      generateType: worker
      talosVersion: {{ default (include "kommodity.talosVersion" $) (dig "talos" "version" "" $np) }}
      {{- /* Build merged MachineConfig strategic patch for workers */ -}}
      {{- $mergedPatch := include "kommodity-cluster.mergedStrategicPatch" (dict
        "globalPatches" $.Values.kommodity.global.strategicPatches
        "nodepoolPatches" $np.strategicPatches
        "taints" $np.taints
        "labels" $np.labels
        "annotations" $np.annotations
        "installer" $.Values.talos.installer
        "logLevel" $.Values.kommodity.logLevel
      ) | trim -}}
      {{- $hetznerPrivate := and (eq $.Values.kommodity.provider.name "Hetzner") (not $.Values.kommodity.network.ipv4.public) }}
      {{- $hetznerNameservers := ternary (dig "nameservers" (list) $.Values.kommodity.network) (list) (eq $.Values.kommodity.provider.name "Hetzner") }}
      {{- $kmsEndpoint := "" -}}
      {{- if $.Values.kommodity.kms.enabled }}{{- $kmsEndpoint = $.Values.kommodity.kms.endpoint -}}{{- end -}}
      {{- $additionalVolumesPatch := include "kommodity.talos.additionalVolumes" (dict "additionalVolumes" $np.additionalVolumes "kmsEndpoint" $kmsEndpoint) | trim -}}
      {{- $needsStrategicPatches := or (not (empty $mergedPatch)) $.Values.kommodity.kms.enabled $.Values.kommodity.security.enabled (gt (len (default list $np.instanceVolumes)) 0) (not (empty $additionalVolumesPatch)) $hetznerPrivate (not (empty $hetznerNameservers)) }}
      {{- if $needsStrategicPatches }}
      strategicPatches:
      {{- if not (empty $mergedPatch) }}
{{ $mergedPatch | nindent 6 }}
      {{- end }}
      {{- if $.Values.kommodity.kms.enabled }}
      {{- /* VolumeConfig for KMS disk encryption*/}}
{{- include "kommodity.talos.volumeEncryption" (dict "endpoint" $.Values.kommodity.kms.endpoint) | nindent 6 }}
      {{- end }}
      {{- if $np.instanceVolumes }}
      {{- /* UserVolumeConfig for instance-local disks (not cloud-provisioned) */ -}}
{{- include "kommodity.talos.instanceVolumes" (dict "instanceVolumes" $np.instanceVolumes "kmsEndpoint" $kmsEndpoint "kmsEnabled" $.Values.kommodity.kms.enabled) | nindent 6 }}
      {{- end }}
      {{- if not (empty $additionalVolumesPatch) }}
      {{- /* UserVolumeConfig for cloud-provisioned data disks (Azure dataDisks, etc.) */ -}}
{{ $additionalVolumesPatch | nindent 6 }}
      {{- end }}
      {{- if $.Values.kommodity.security.enabled }}
      {{- /* ExtensionServiceConfig for kommodity-attestation extension */ -}}
{{- include "kommodity.talos.attestationExtensionServiceConfig" (dict "logLevel" $.Values.kommodity.logLevel) | nindent 6 }}
      {{- end }}
      {{- if $hetznerPrivate }}
      {{- /* Hetzner's DHCP does not announce the network's 0.0.0.0/0 route */ -}}
{{- include "kommodity.talos.defaultRoute" (dict "nodeCIDR" $.Values.kommodity.network.ipv4.nodeCIDR) | nindent 6 }}
      {{- end }}
      {{- if $hetznerNameservers }}
      {{- /* Nameservers for the node, propagated by Talos to CoreDNS */ -}}
{{- include "kommodity.talos.resolverConfig" (dict "nameservers" $hetznerNameservers) | nindent 6 }}
      {{- end }}
      {{- end }}
{{- end }}
