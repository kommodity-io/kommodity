{{/*
Strategic patch setting the node's default route.
Used in TalosConfigTemplate and TalosControlPlane.
The gateway is the first usable address of the given CIDR. With public: false the
private NIC is the only physical device, so it is matched by selector; Hetzner
names it enp7s0, not eth0.
*/}}
{{- define "kommodity.talos.defaultRoute" -}}
{{- $cidr := required "kommodity.network.ipv4.nodeCIDR is required when public is false" .nodeCIDR -}}
{{- $octets := splitList "/" $cidr | first | splitList "." -}}
{{- $gateway := printf "%s.%s.%s.%d" (index $octets 0) (index $octets 1) (index $octets 2) (add (int (index $octets 3)) 1) -}}
- |
  machine:
    network:
      interfaces:
        - deviceSelector:
            physical: true
          dhcp: true
          routes:
            - network: 0.0.0.0/0
              gateway: {{ $gateway }}
{{- end -}}
