{{- /* TalosControlPlane requires a clonable infra template reference; byot
       machines are static (one publicIP each), so byot skips this object.
       See templates/provider/byot/machines.yaml. */ -}}
{{- if ne $.Values.kommodity.provider.name "Byot" }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3
kind: TalosControlPlane
metadata:
  name: {{ $.Release.Name }}-controlplane
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kommodity
spec:
  {{- if and (hasKey .Values.kommodity.controlplane "kubernetes") (hasKey .Values.kommodity.controlplane.kubernetes "version") }}
  version: {{ $.Values.kommodity.controlplane.kubernetes.version }}
  {{- else }}
  version: {{ $.Values.kubernetes.version }}
  {{- end }}
  replicas: {{ $.Values.kommodity.controlplane.replicas }}
  rolloutStrategy:
    rollingUpdate:
      maxSurge: 1
    type: RollingUpdate
  infrastructureTemplate:
    {{- if not $.Values.kommodity.provider.name }}
    {{- fail "kommodity.provider.name must be set in values.yaml" -}}
    {{- else if eq $.Values.kommodity.provider.name "Docker" }}
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: DockerMachineTemplate
    {{- else if eq $.Values.kommodity.provider.name "Scaleway" }}
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: ScalewayMachineTemplate
    {{- else if eq $.Values.kommodity.provider.name "Kubevirt" }}
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: KubevirtMachineTemplate
    {{- else if eq $.Values.kommodity.provider.name "Azure" }}
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AzureMachineTemplate
    {{- else if eq $.Values.kommodity.provider.name "Hetzner" }}
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: HCloudMachineTemplate
    {{- else }}
    {{- fail "infrastructure provider is not supported" -}}
    {{- end }}
    name: {{ .Release.Name }}-controlplane-{{ include "kommodity-cluster.machineSpecsHash" (dict "poolValues" .Values.kommodity.controlplane "allValues" .Values) }}
    namespace: {{ $.Release.Namespace }}
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: {{ default (include "kommodity.talosVersion" $) (dig "talos" "version" "" $.Values.kommodity.controlplane) }}
      {{- /*
        Bake the hostname into the machine config so it is set before etcd
        starts. Without a source the node keeps the hostname Talos generates
        for itself until the platform applies the real one, and an etcd member
        that registers under the generated name cannot rejoin once it changes.
        InfrastructureName matches the node name the infrastructure provider
        and the CCM use.

        Hetzner only. Changing this field makes every existing control plane
        machine mismatch its TalosConfig, which rolls the control plane, so it
        is applied where the failure has been observed rather than everywhere.
      */}}
      {{- if eq $.Values.kommodity.provider.name "Hetzner" }}
      hostname:
        source: InfrastructureName
      {{- else }}
      hostname: {}
      {{- end }}
      {{- $cp := $.Values.kommodity.controlplane }}
      {{- $cpPatches := dig "strategicPatches" nil $cp }}
      {{- $globalPatches := dig "global" "strategicPatches" nil $.Values.kommodity }}
      {{- $cpTaints := dig "taints" nil $cp }}
      {{- $cpLabels := dig "labels" nil $cp }}
      {{- $cpAnnotations := dig "annotations" nil $cp }}
      {{- $oidc := dig "oidc" nil $.Values.kommodity }}
      {{- $hetznerPrivate := and (eq $.Values.kommodity.provider.name "Hetzner") (not $.Values.kommodity.network.ipv4.public) }}
      {{- /* Build merged MachineConfig strategic patch */ -}}
      {{- $mergedPatch := include "kommodity-cluster.mergedStrategicPatch" (dict
        "globalPatches" $globalPatches
        "nodepoolPatches" $cpPatches
        "taints" $cpTaints
        "labels" $cpLabels
        "annotations" $cpAnnotations
        "oidc" $oidc
        "installer" $.Values.talos.installer
        "logLevel" $.Values.kommodity.logLevel
        "disableCNI" $.Values.talos.disableCNI
        "disableProxy" $.Values.talos.disableKubeProxy
      ) | trim }}
      {{- $hetznerNameservers := ternary (dig "nameservers" (list) $.Values.kommodity.network) (list) (eq $.Values.kommodity.provider.name "Hetzner") }}
      {{- $kmsEndpoint := "" -}}
      {{- if $.Values.kommodity.kms.enabled }}{{- $kmsEndpoint = $.Values.kommodity.kms.endpoint -}}{{- end -}}
      {{- $additionalVolumesPatch := include "kommodity.talos.additionalVolumes" (dict "additionalVolumes" $.Values.kommodity.controlplane.additionalVolumes "kmsEndpoint" $kmsEndpoint) | trim }}
      strategicPatches:
      {{- /* Merged MachineConfig patch (labels, taints, annotations, env, installer, OIDC, CNI, proxy, CCM, user patches) */ -}}
      {{- if not (empty $mergedPatch) }}
{{ $mergedPatch | nindent 6 }}
      {{- end }}
      {{- if $.Values.kommodity.kms.enabled }}
      {{- /* VolumeConfig for disk encryption (Talos v1.12+) */ -}}
{{- include "kommodity.talos.volumeEncryption" (dict "endpoint" $.Values.kommodity.kms.endpoint) | nindent 6 }}
      {{- end }}
      {{- if $.Values.kommodity.controlplane.instanceVolumes }}
      {{- /* UserVolumeConfig for instance-local disks (not cloud-provisioned) */ -}}
{{- include "kommodity.talos.instanceVolumes" (dict "instanceVolumes" $.Values.kommodity.controlplane.instanceVolumes "kmsEndpoint" $kmsEndpoint "kmsEnabled" $.Values.kommodity.kms.enabled) | nindent 6 }}
      {{- end }}
      {{- if $hetznerPrivate }}
      {{- /* Hetzner's DHCP does not announce the network's 0.0.0.0/0 route */ -}}
{{- include "kommodity.talos.defaultRoute" (dict "nodeCIDR" $.Values.kommodity.network.ipv4.nodeCIDR) | nindent 6 }}
      {{- end }}
      {{- if $hetznerNameservers }}
      {{- /* Nameservers for the node, propagated by Talos to CoreDNS */ -}}
{{- include "kommodity.talos.resolverConfig" (dict "nameservers" $hetznerNameservers) | nindent 6 }}
      {{- end }}
      {{- if not (empty $additionalVolumesPatch) }}
      {{- /* UserVolumeConfig for cloud-provisioned data disks (Azure dataDisks, etc.) */ -}}
{{ $additionalVolumesPatch | nindent 6 }}
      {{- end }}
      {{- /* ExtensionServiceConfig for kommodity-autobootstrap extension */ -}}
{{- include "kommodity.talos.autoBootstrapExtensionServiceConfig" (dict "autoBootstrap" $.Values.talos.autoBootstrap "logLevel" $.Values.kommodity.logLevel "replicas" (default 1 $.Values.kommodity.controlplane.replicas)) | nindent 6 }}
      {{- if $.Values.kommodity.security.enabled }}
      {{- /* ExtensionServiceConfig for kommodity-attestation extension */ -}}
{{- include "kommodity.talos.attestationExtensionServiceConfig" (dict "logLevel" $.Values.kommodity.logLevel) | nindent 6 }}
      {{- end }}
{{- end }}