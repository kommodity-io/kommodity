{{- define "kommodity-cluster.oidcAuthenticationConfig" -}}
{{- /*
KubeAuthenticationConfig document for kube-apiserver OIDC authentication
(Talos v1.14+): KubeAPIServerConfig.extraArgs rejects oidc-* and anonymous-auth
flags. The translation follows the Talos v1.14 flag equivalents:

  --oidc-issuer-url    -> jwt[].issuer.url
  --oidc-client-id     -> jwt[].issuer.audiences[]
  --oidc-username-claim -> jwt[].claimMappings.username.claim
  --oidc-groups-claim  -> jwt[].claimMappings.groups.claim

The structured config has no defaulting (legacy flags default username claim
to "sub", prefix to "<issuer-url>#"), so claim and prefix are always set
explicitly. OIDC client extra flags for `kubectl oidc-login` do NOT belong
here; those go in the oidc-client Secret.
*/ -}}
{{- $oidc := .oidc -}}
{{- $usernameClaim := $oidc.usernameClaim | default "sub" -}}
{{- $username := dict "claim" $usernameClaim "prefix" (printf "%s#" $oidc.issuerURL) -}}
{{- $jwt := dict "issuer" (dict "url" $oidc.issuerURL "audiences" (list $oidc.clientID)) "claimMappings" (dict "username" $username) -}}
{{- if $oidc.groupsClaim -}}
{{- $_ := set (index $jwt "claimMappings") "groups" (dict "claim" $oidc.groupsClaim "prefix" "") -}}
{{- end -}}
{{- $doc := dict "apiVersion" "v1alpha1" "kind" "KubeAuthenticationConfig" "configuration" (dict "jwt" (list $jwt)) -}}
{{- $doc | toYaml -}}
{{- end -}}
