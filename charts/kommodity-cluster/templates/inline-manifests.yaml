{{/*
Generate KubeInlineManifestConfig documents (Talos v1.14 multi-doc kind)
for both addons and extra secrets with delivery: InlineManifest.

Each inline manifest is one separate strategic patch list item — a full
document with apiVersion, kind: KubeInlineManifestConfig, name and
manifest (the former v1alpha1 cluster.inlineManifests contents field).
Concatenates the outputs of kommodity.addon.inlineManifestDocs and
kommodity.extraSecrets.inlineManifestDocs.

Usage: {{ include "kommodity.inlineManifests" (dict "addons" $.Values.kommodity.addons "extraSecrets" $.Values.kommodity.extraSecrets "root" $) }}
*/}}
{{- define "kommodity.inlineManifests" -}}
{{- include "kommodity.addon.inlineManifestDocs" (dict "addons" .addons "root" .root) -}}
{{- include "kommodity.extraSecrets.inlineManifestDocs" (dict "extraSecrets" .extraSecrets "root" .root) -}}
{{- end -}}
{{/*
Generate KubeInlineManifestConfig documents for extra secrets with
delivery: InlineManifest. Emits one document per secret — no outer
cluster.inlineManifests wrapper. Called by kommodity.inlineManifests.

Usage: {{ include "kommodity.extraSecrets.inlineManifestDocs" (dict "extraSecrets" $.Values.kommodity.extraSecrets "root" $) }}
*/}}
{{- define "kommodity.extraSecrets.inlineManifestDocs" -}}
{{- $root := .root -}}
{{- $extraSecrets := .extraSecrets | default dict -}}
{{- $namespaces := keys $extraSecrets | sortAlpha -}}
{{- range $namespace := $namespaces -}}
{{- $secrets := index $extraSecrets $namespace -}}
{{- range $secretName, $secret := $secrets -}}
{{- if eq (default "CRS" $secret.delivery) "InlineManifest" }}
{{- $manifest := include "kommodity.extraSecrets.manifest" (dict "secret" $secret "secretName" $secretName "namespace" $namespace "release" $root.Release.Name) | trim -}}
- |
  apiVersion: v1alpha1
  kind: KubeInlineManifestConfig
  name: {{ $namespace }}-{{ $secretName }}
  manifest: |-
{{ $manifest | indent 4 }}{{ "\n" }}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
