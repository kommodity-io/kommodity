{{/*
Generate inline manifest items for addons with delivery: InlineManifest.
Emits list items (name + contents) only — no outer cluster.inlineManifests
wrapper. Called by the wrapper helper kommodity.inlineManifests.

Usage: {{ include "kommodity.addon.inlineManifestItems" (dict "addons" $.Values.kommodity.addons "root" $) }}
*/}}
{{- define "kommodity.addon.inlineManifestItems" -}}
{{- $root := .root -}}
{{- $addonNames := keys .addons | sortAlpha -}}
{{- range $name := $addonNames -}}
{{- $addon := index $.addons $name -}}
{{- if and $addon.enabled (eq (default "CRS" $addon.delivery) "InlineManifest") }}
{{- $addonNamespace := default $name $addon.namespace -}}
{{- if $addon.namespace }}
{{- $nsManifest := include "kommodity.addon.namespace" (dict "namespace" $addon.namespace) | trim }}
- name: {{ $name }}-namespace
  contents: |-
{{ $nsManifest | indent 4 }}
{{- end }}
{{- if $addon.manifest }}
{{- $manifestContents := tpl $addon.manifest $root | trim }}
- name: {{ $name }}-manifest
  contents: |-
{{ $manifestContents | indent 4 }}
{{- end }}
{{- if $addon.initialExtraValues }}
{{- $valsManifest := include "kommodity.addon.extra-values" (dict "name" $name "namespace" $addonNamespace "initialExtraValues" $addon.initialExtraValues) | trim }}
- name: {{ $name }}-extra-values
  contents: |-
{{ $valsManifest | indent 4 }}
{{- end }}
{{- $installerManifest := include "kommodity.addon.installer" (dict "name" $name "addon" $addon) | trim }}
- name: {{ $name }}-installer
  contents: |-
{{ $installerManifest | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
