{{/*
Generate KubeInlineManifestConfig documents for addons with delivery:
InlineManifest. Emits one document per manifest — no outer
cluster.inlineManifests wrapper. Called by kommodity.inlineManifests.

Usage: {{ include "kommodity.addon.inlineManifestDocs" (dict "addons" $.Values.kommodity.addons "root" $) }}
*/}}
{{- define "kommodity.addon.inlineManifestDocs" -}}
{{- $root := .root -}}
{{- $addonNames := keys .addons | sortAlpha -}}
{{- range $name := $addonNames -}}
{{- $addon := index $.addons $name -}}
{{- if and $addon.enabled (eq (default "CRS" $addon.delivery) "InlineManifest") }}
{{- $addonNamespace := default $name $addon.namespace -}}
{{- if $addon.namespace }}
{{- $nsManifest := include "kommodity.addon.namespace" (dict "namespace" $addon.namespace) | trim }}
- |
  apiVersion: v1alpha1
  kind: KubeInlineManifestConfig
  name: {{ $name }}-namespace
  manifest: |-
{{ $nsManifest | indent 4 }}{{ "\n" }}
{{- end }}
{{- if $addon.manifest }}
{{- $manifestContents := tpl $addon.manifest $root | trim }}
- |
  apiVersion: v1alpha1
  kind: KubeInlineManifestConfig
  name: {{ $name }}-manifest
  manifest: |-
{{ $manifestContents | indent 4 }}{{ "\n" }}
{{- end }}
{{- if $addon.initialExtraValues }}
{{- $valsManifest := include "kommodity.addon.extra-values" (dict "name" $name "namespace" $addonNamespace "initialExtraValues" $addon.initialExtraValues) | trim }}
- |
  apiVersion: v1alpha1
  kind: KubeInlineManifestConfig
  name: {{ $name }}-extra-values
  manifest: |-
{{ $valsManifest | indent 4 }}{{ "\n" }}
{{- end }}
{{- $installerManifest := include "kommodity.addon.installer" (dict "name" $name "addon" $addon) | trim }}
- |
  apiVersion: v1alpha1
  kind: KubeInlineManifestConfig
  name: {{ $name }}-installer
  manifest: |-
{{ $installerManifest | indent 4 }}{{ "\n" }}
{{- end }}
{{- end }}
{{- end }}
