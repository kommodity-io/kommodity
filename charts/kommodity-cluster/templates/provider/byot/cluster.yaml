{{- if eq .Values.kommodity.provider.name "Byot" }}
{{- $staticCPs := .Values.kommodity.controlplane.staticMachines | default list }}
{{- if eq (len $staticCPs) 0 }}
{{- fail "kommodity.controlplane.staticMachines must contain at least one entry with a publicIP when provider is Byot" -}}
{{- end }}
{{- $endpointHost := (index $staticCPs 0).publicIP }}
{{- $endpointPort := 6443 }}
{{- with .Values.kommodity.provider.config }}
{{- if hasKey . "endpoint" }}
{{- $endpointHost = .endpoint.host }}
{{- $endpointPort = .endpoint.port | default 6443 }}
{{- end }}
{{- end }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ByotCluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kommodity
  annotations:
    helm.sh/resource-policy: keep # Prevent Helm from deleting the resource on uninstall, deletion will be handled by CAPI
spec:
  controlPlaneEndpoint:
    host: {{ $endpointHost }}
    port: {{ $endpointPort }}
{{- end }}
