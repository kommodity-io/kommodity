{{- /*
  publicipaddresses.yaml — standalone ASO PublicIPAddress CRs for Azure clusters.

  These are opt-in, Azure-only resources that provision one or more standalone
  PublicIP addresses in the cluster's resource group. They are NOT bound to a
  CAPZ-managed load balancer or NAT gateway — CAPZ has no standalone
  PublicIPAddress CRD and only creates PIPs implicitly inside AzureCluster
  networkSpec (apiServerLB frontend, NAT-gw, outbound LBs).

  Use case: Envoy gateways (or any workload needing a deterministic public
  address) reference the PIP from a Kubernetes Service of type LoadBalancer
  via the Azure CCM annotations:

    service.beta.kubernetes.io/azure-pip-name: <map key>
    service.beta.kubernetes.io/azure-load-balancer-resource-group: <cluster RG>

  The Azure cloud-controller-manager then binds the pre-provisioned PIP to the
  Service's LB frontend, giving the gateway a stable public address that
  survives Service/LB reconciliation.

  Gating: only emitted when
    1. provider is Azure
    2. kommodity.provider.azure.publicIPAddresses is a non-empty map

  Available in all Azure configurations (public/private, BYO-VNet/managed-VNet).

  Values shape — a MAP keyed by PIP name, not a list. Helm merges maps deeply
  across base + overlay values files, so an overlay can disable a single base
  PIP (enabled: false) or add new ones without re-specifying the whole list.
  That is not possible with a list, which Helm replaces wholesale on overlay.
  Entries default to enabled; disabling an entry removes its CR on the next
  install/upgrade, and ASO then deletes the underlying Azure PublicIP.

  Lifecycle: these CRs deliberately do NOT carry helm.sh/resource-policy: keep.
  They use the default ASO reconcile-policy (manage), so `helm uninstall` deletes
  the CRs and ASO then deletes the underlying Azure PublicIPs. This matches the
  established ASO network-resources pattern (networkresources.yaml).
*/}}
{{- $isAzure := eq .Values.kommodity.provider.name "Azure" }}
{{- $pips := dig "provider" "azure" "publicIPAddresses" dict .Values.kommodity | default dict }}
{{- if and $isAzure $pips }}
{{- $rg := dig "config" "resourceGroup" "" .Values.kommodity.provider | default .Release.Name }}
{{- $asoSecret := printf "%s-aso-secret" .Release.Name }}
{{- $location := required "missing required location in kommodity.provider.config for Azure" (dig "config" "location" "" .Values.kommodity.provider) }}
{{- /* Go templates range over maps in sorted key order, so the render order
     (and the documentIndex order in helm unittest) is deterministic. */}}
{{- range $pipName, $pip := $pips }}
{{- /* The map key becomes the CR metadata.name, which the Kubernetes API
     server validates as a DNS-1123 subdomain. Validate here and fail fast
     with an actionable message at helm template/install time — an invalid
     key otherwise surfaces as a cryptic admission error far from the
     values file that set it. */}}
{{- if or (gt (len $pipName) 253) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$" $pipName)) }}
{{- fail (printf "invalid PublicIP key %q in kommodity.provider.azure.publicIPAddresses: map keys become the PublicIPAddress resource name and must be valid DNS-1123 subdomains (lowercase alphanumeric, '-' and '.', max 253 chars). An invalid key otherwise fails at CR admission with a cryptic error far from the values file." $pipName) }}
{{- end }}
{{- $enabled := dig "enabled" true $pip }}
{{- if $enabled }}
{{- /* The map key IS the full Azure resource name: the PIP lives in the
     cluster-specific resource group, so no release-name prefix is needed
     to avoid cross-cluster collisions. */}}
{{- $pipResName := $pipName }}
---
apiVersion: network.azure.com/v1api20240301
kind: PublicIPAddress
metadata:
  name: {{ $pipResName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    serviceoperator.azure.com/credential-from: {{ $asoSecret }}
spec:
  azureName: {{ $pipResName }}
  location: {{ $location }}
  owner:
    name: {{ $rg }}
  publicIPAllocationMethod: Static
  sku:
    name: Standard
  {{- with $pip.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $pip.zones }}
  zones:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
