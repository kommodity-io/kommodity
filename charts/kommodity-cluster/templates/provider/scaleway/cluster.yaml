{{- if eq .Values.kommodity.provider.name "Scaleway" }}
{{- $zones := include "kommodity-cluster.controlPlaneZones" . | fromJsonArray }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ScalewayCluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: kommodity
  annotations:
    helm.sh/resource-policy: keep # Prevent Helm from deleting the resource on uninstall, deletion will be handled by CAPI
spec:
  {{- if gt (len $zones) 0 }}
  failureDomains:
  {{- range $zones }}
    - {{ . }}
  {{- end }}
  {{- end }}
  {{- $scaleway := dig "scaleway" (dict) .Values.kommodity.provider | default (dict) }}
  {{- $projectID := dig "projectID" "" $scaleway }}
  {{- if $projectID }}
  projectID: {{ $projectID }}
  {{- else }}
  {{- fail "missing required projectID in kommodity.provider.scaleway for Scaleway" -}}
  {{- end }}
  region: {{ required "missing required region in kommodity.provider.scaleway for Scaleway" (dig "region" "" $scaleway) }}
  {{- /* Scaleway requires the credentials Secret; both ScalewayCluster.scalewaySecretName
         and the CCM delivery reference it, and both default to "scaleway-secret". */}}
  {{- $secretName := dig "name" "scaleway-secret" (dig "secret" (dict) $scaleway | default (dict)) | default "scaleway-secret" }}
  scalewaySecretName: {{ $secretName }}
  {{- if and .Values.kommodity.network.ipv4.enabled (not .Values.kommodity.network.ipv4.public) }}
  network:
    privateNetwork:
      enabled: true
      subnet: {{ required "missing required nodeCIDR in kommodity.network.ipv4" .Values.kommodity.network.ipv4.nodeCIDR }}
    publicGateways:
      - type: {{ dig "publicGateway" "type" "" .Values.kommodity.network | default "VPC-GW-S" }}
        {{- if dig "publicGateway" "zone" "" .Values.kommodity.network }}
        zone: {{ .Values.kommodity.network.publicGateway.zone }}
        {{- end }}
        {{- if dig "publicGateway" "ip" "" .Values.kommodity.network }}
        ip: {{ .Values.kommodity.network.publicGateway.ip }}
        {{- end }}
        enableSMTP: {{ dig "publicGateway" "enableSMTP" false .Values.kommodity.network }}
  {{- end }}
{{- end }}
