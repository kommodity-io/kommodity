# Example values to deploy a cluster whose nodes are claimed from a ByotHost
# registry (Bring Your Own Talos). Operators add ByotHost objects (IP-only
# records of maintenance-mode Talos boxes) out of band; this chart claims them
# by label selector and adopts them as control-plane / worker nodes.
#
# Hosts are claimed at runtime, so node IPs are NOT known at render time. The
# control-plane endpoint therefore cannot be auto-derived and MUST be set
# explicitly (see kommodity.provider.config.controlPlaneEndpoint below).
kommodity:
  provider:
    name: Byot
    # Control-plane endpoint (REQUIRED). CAPI's clusterv1.APIEndpoint is a
    # single {host, port} consumed at cluster creation to generate the admin
    # kubeconfig and seed node join config, so it must exist before any host
    # is claimed. CP host IPs are resolved at claim time and cannot be used
    # here. Pick one:
    #   - a VIP / load balancer / DNS name fronting the control plane (HA),
    #   - or one committed CP host IP (dev/smallest config; note: with a bare
    #     IP the API is unreachable until that specific host is claimed, and
    #     claim order is non-deterministic, so prefer a VIP for HA).
    config:
      controlPlaneEndpoint:
        host: 203.0.113.10
        port: 6443

  clusterAutoscaler:
    enabled: false # Default off; byot CAN scale if Available ByotHosts exist beyond replicas.

  network:
    ipv4:
      enabled: true
      public: true # Byot hosts are reached by public IP (maintenance API, port 50000).

  controlplane:
    replicas: 3
    # SKU-driven host selector. The chart maps these to the curated byot.io/
    # labels the ByotHost controller promotes, and claims Available hosts
    # matching them (exact-match).
    resources:
      cpu: "4" # Required
      memory: "16G" # Required (one of 4G 8G 16G 32G 64G 128G)
    os:
      disk:
        type: ssd # Optional (one of nvme ssd hdd sd)
        size: "100G" # Optional (one of 20G 100G 250G 500G 1T)
    # zones:
    #   - par01
    #   - par02
    # Optional freeform hostSelector
    # hostSelector:
    #   matchLabels:
    #     site: gefion
    #   matchExpressions:
    #     - key: byot.io/platform
    #       operator: In
    #       values: [scaleway]
    healthCheck:
      enabled: true
      unhealthyConditions:
        - type: Ready
          status: Unknown
          timeout: 300s
        - type: Ready
          status: "False"
          timeout: 300s
    # kubernetes:
    #   version: v1.33.4
    # talos:
    #   version: v1.13.0

  nodepools:
    default:
      replicas: 2
      resources:
        cpu: "4"
        memory: "16G"
      os:
        disk:
          type: ssd
          size: "100G"
      # zones:
      #   - par01
      #   - par02
      # autoscaling:
      #   minReplicas: 2
      #   maxReplicas: 4
      # hostSelector:
      #   matchLabels:
      #     site: gefion
      healthCheck:
        enabled: true
        unhealthyConditions:
          - type: Ready
            status: Unknown
            timeout: 300s
          - type: Ready
            status: "False"
            timeout: 300s

talos:
  # Talos version must match the maintenance-mode ByotHosts being claimed.
  version: v1.13.8
