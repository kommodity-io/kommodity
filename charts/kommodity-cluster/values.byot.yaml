# Example values to deploy a cluster whose nodes are claimed from a ByotHost
# registry (Bring Your Own Talos). Operators add ByotHost objects (IP-only
# records of maintenance-mode Talos boxes) out of band; this chart claims them
# by label selector and adopts them as control-plane / worker nodes.
kommodity:
  provider:
    name: Byot
    # Control-plane endpoint (REQUIRED). Must exist before any host
    # is claimed. CP host IPs are resolved at claim time and cannot be used
    # here (VIP / load balancer / DNS name fronting the control plane (HA)).
    config:
      controlPlaneEndpoint:
        host: 51.159.191.13
        port: 6443

  network:
    ipv4:
      enabled: true
      public: true # Byot hosts are reached by public IP (maintenance API, port 50000).

  controlplane:
    replicas: 1
    # SKU-driven host selector. The chart maps these to the curated byot.io/
    # labels the ByotHost controller promotes, and claims Available hosts
    # matching them (exact-match).
    resources:
      cpu: "3" # Required
      memory: "4G" # Required (one of 4G 8G 16G 32G 64G 128G)
    os:
      disk:
        type: hdd # Optional (one of nvme ssd hdd sd)
        size: "20G" # Optional (one of 20G 100G 250G 500G 1T)
    # zones:
    #   - par01
    #   - par02
    # Optional freeform hostSelector
    hostSelector:
      matchLabels:
        role: control-plane
    #   matchExpressions:
    #     - key: byot.io/platform
    #       operator: In
    #       values: [scaleway]
    healthCheck:
      enabled: true
      unhealthyConditions:
        - type: Ready
          status: Unknown
          timeout: 300s
        - type: Ready
          status: "False"
          timeout: 300s
    # kubernetes:
    #   version: v1.33.4
    # talos:
    #   # Overrides the global talos.version for this nodepool's machines.
    #   # Drives ByotMachineTemplate.spec.desiredTalosVersion (post-adoption
    #   # Talos upgrade target) with nodepool precedence over the global value.
    #   version: v1.13.0

  nodepools:
    default:
      talos:
        version: v1.13.9
      replicas: 1
      resources:
        cpu: "3"
        memory: "4G"
      os:
        disk:
          type: hdd
          size: "20G"
      # zones:
      #   - par01
      #   - par02
      hostSelector:
        matchLabels:
          role: worker
      # autoscaling:
      #   minReplicas: 2
      #   maxReplicas: 4
      # hostSelector:
      #   matchLabels:
      #     site: copenhagen
      healthCheck:
        enabled: true
        unhealthyConditions:
          - type: Ready
            status: Unknown
            timeout: 300s
          - type: Ready
            status: "False"
            timeout: 300s

talos:
  # Talos version must match the maintenance-mode ByotHosts being claimed.
  # For Byot this also drives ByotMachineTemplate.spec.desiredTalosVersion
  # (the post-adoption upgrade target installer image). A nodepool-level
  # talos.version overrides this for that nodepool's machines. Omitted
  # (opt-out of version management) unless talos.installer is set.
  version: v1.13.8
  # installer is the bare Talos installer image (no tag); the resolved
  # talos.version (global or nodepool override) is appended as the tag, so
  # the initial install and the ByotMachineTemplate desiredTalosVersion stay
  # in sync. Without this block desiredTalosVersion is omitted (opt-out of
  # version management) and the install image falls back to talos.imageName.
  installer:
    repository: ghcr.io/siderolabs
    imageName: installer
