# Source: https://github.com/hetznercloud/hcloud-cloud-controller-manager/blob/v1.34.0/deploy/ccm.yaml
# Deployment of the cloud-controller-manager inside the cluster.
# Placed in files/ so that it can be rendered as a single manifest by the ClusterResourceSet.
#
# Deliberate divergences from the upstream manifest:
#  - image is templated from kommodity.provider.cloudControllerManager.image;
#  - the HCLOUD_TOKEN secret key is "hcloud", not upstream's "token", because the
#    kommodity CCM ClusterResourceSet delivers one Secret shared with hcloud-csi
#    (see kommodity.io/ccm-downstream-secret-name);
#  - the Robot (bare-metal) env vars are dropped; kommodity wires hcloud only;
#  - NODE_NAME plus --allocate-node-cidrs/--cluster-cidr/HCLOUD_NETWORK are added
#    for private-network clusters, where CAPH names the network after the cluster;
#  - the watch-based route-reconciliation feature gate is dropped, keeping the
#    periodic --route-reconciliation-period path.
# Everything else - RBAC scope, securityContext, tolerations, priorityClassName,
# metrics port - tracks upstream and should be updated with it.
{{- $privateNetwork := and .Values.kommodity.network.ipv4.enabled (not .Values.kommodity.network.ipv4.public) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "system:hcloud-cloud-controller-manager"
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - "*"
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services/status
    verbs:
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Upstream's scoped ClusterRole for the CCM; ":restricted" is part of its name.
  name: "system:hcloud-cloud-controller-manager:restricted"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "system:hcloud-cloud-controller-manager"
subjects:
  - kind: ServiceAccount
    name: hcloud-cloud-controller-manager
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: hcloud-cloud-controller-manager
  template:
    metadata:
      labels:
        app: hcloud-cloud-controller-manager
    spec:
      serviceAccountName: hcloud-cloud-controller-manager
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      dnsPolicy: Default
      tolerations:
        # Allow scheduling on uninitialized and control-plane nodes.
        - key: "node.cloudprovider.kubernetes.io/uninitialized"
          value: "true"
          effect: "NoSchedule"
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        - key: "node-role.kubernetes.io/master"
          effect: NoSchedule
          operator: Exists
        - key: "node-role.kubernetes.io/control-plane"
          effect: NoSchedule
          operator: Exists
        - key: "node.kubernetes.io/not-ready"
          effect: "NoExecute"
      containers:
        - name: hcloud-cloud-controller-manager
          image: {{ .Values.kommodity.provider.cloudControllerManager.image.repository }}:{{ .Values.kommodity.provider.cloudControllerManager.image.tag }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - --allow-untagged-cloud
            - --cloud-provider=hcloud
            - --route-reconciliation-period=30s
            - --webhook-secure-port=0
            - --leader-elect=false
            {{- if $privateNetwork }}
            - --allocate-node-cidrs=true
            - --cluster-cidr={{ index .Values.kommodity.network.cluster.podCIDR 0 }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hcloud
                  key: hcloud
            {{- if $privateNetwork }}
            # CAPH names the private network after the HetznerCluster.
            - name: HCLOUD_NETWORK
              value: {{ .Release.Name }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8233
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
      priorityClassName: "system-cluster-critical"
