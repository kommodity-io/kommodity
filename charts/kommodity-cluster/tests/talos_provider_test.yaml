suite: test creation of resources for Talos
values:
  - ../values.scaleway.yaml
release:
  name: test-cluster
  namespace: default
set:
  kommodity.kms.endpoint: "https://kms.example.com"
templates:
  - templates/*
tests:
  # TalosControlPlane tests
  - it: should make sure a TalosControlPlane is created
    template: templates/talos/controlplane.yaml
    asserts:
      - isKind:
          of: TalosControlPlane
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: "test-cluster-controlplane"
      - equal:
          path: spec.infrastructureTemplate.kind
          value: ScalewayMachineTemplate

  # TalosConfigTemplate tests
  - it: should make sure a TalosConfigTemplate is created
    template: templates/talos/configtemplate.yaml
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$

  # Hash change tests
  - it: should update the TalosConfigTemplate name when kms config is changed
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.kms.enabled: true
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$

  - it: should update the TalosConfigTemplate name when global strategic patches are changed
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.global.machineConfig:
        EnvironmentConfig:
          variables:
            CHANGED_VAR: changed-value
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$

  - it: should update the TalosConfigTemplate name when nodepool strategic patches are changed
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.machineConfig:
        EnvironmentConfig:
          variables:
            NODEPOOL_VAR: nodepool-value
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$

  - it: should update the TalosConfigTemplate name when Talos version is changed
    template: templates/talos/configtemplate.yaml
    set:
      talos.version: "new-version"
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$

  # Strategic patch merging tests
  - it: should merge global and nodepool strategic patches
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.global.machineConfig:
        EnvironmentConfig:
          variables:
            GLOBAL_VAR: global-value
      kommodity.nodepools.default.machineConfig:
        EnvironmentConfig:
          variables:
            NODEPOOL_VAR: nodepool-value
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.strategicPatches[2]
          pattern: "GLOBAL_VAR: global-value"
      - matchRegex:
          path: spec.template.spec.strategicPatches[2]
          pattern: "NODEPOOL_VAR: nodepool-value"
      - matchRegex:
          path: spec.template.spec.strategicPatches[2]
          pattern: "LOG_LEVEL: warn"

  - it: should let nodepool patches override global patches for same key
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.global.machineConfig:
        EnvironmentConfig:
          variables:
            SHARED_VAR: global-value
      kommodity.nodepools.default.machineConfig:
        EnvironmentConfig:
          variables:
            SHARED_VAR: nodepool-value
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.strategicPatches[2]
          pattern: "SHARED_VAR: nodepool-value"
      - notMatchRegex:
          path: spec.template.spec.strategicPatches[2]
          pattern: "SHARED_VAR: global-value"

  - it: should merge KubeletConfig doc and v1alpha1 fragment from disjoint sources
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.global.machineConfig:
        KubeletConfig:
          extraArgs:
            cloud-provider: external
      kommodity.nodepools.default.machineConfig:
        machine:
          sysctls:
            net.ipv4.ip_forward: "1"
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.strategicPatches[0]
          pattern: "cloud-provider: external"
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "net.ipv4.ip_forward"

  # Built-in disable document tests (Talos v1.14 multi-doc kinds)
  - it: should emit KubeProxyConfig with enabled false when disableKubeProxy is true
    template: templates/talos/controlplane.yaml
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "kind: KubeProxyConfig"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "enabled: false"
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "disabled: true"

  - it: should emit KubeFlannelCNIConfig with $patch delete when disableCNI is true
    template: templates/talos/controlplane.yaml
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[1]
          pattern: "kind: KubeFlannelCNIConfig"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[1]
          pattern: "\\$patch: delete"
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[1]
          pattern: "cni:"

  - it: should not emit disable documents when flags are false
    template: templates/talos/controlplane.yaml
    set:
      talos.disableCNI: false
      talos.disableKubeProxy: false
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[0]
          pattern: "KubeProxyConfig"
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[0]
          pattern: "KubeFlannelCNIConfig"
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[1]
          pattern: "KubeProxyConfig"
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[1]
          pattern: "KubeFlannelCNIConfig"
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "KubeProxyConfig"
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "KubeFlannelCNIConfig"
  # Control-plane machineConfig tests
  - it: should render controlplane machineConfig in strategic patches
    template: templates/talos/controlplane.yaml
    set:
      kommodity.controlplane.machineConfig:
        EnvironmentConfig:
          variables:
            CP_VAR: cp-value
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[3]
          pattern: "CP_VAR: cp-value"

  - it: should merge global and controlplane machineConfig patches
    template: templates/talos/controlplane.yaml
    set:
      kommodity.global.machineConfig:
        EnvironmentConfig:
          variables:
            GLOBAL_VAR: global-value
      kommodity.controlplane.machineConfig:
        EnvironmentConfig:
          variables:
            CP_VAR: cp-value
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[3]
          pattern: "GLOBAL_VAR: global-value"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[3]
          pattern: "CP_VAR: cp-value"

  # Taints tests
  - it: should emit pool-level taints as KubeNodeConfig taints
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.global.machineConfig: {}
      kommodity.nodepools.default.taints:
        workload: "gpu:NoSchedule"
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$
      - matchRegex:
          path: spec.template.spec.strategicPatches[1]
          pattern: "kind: KubeNodeConfig"
      - matchRegex:
          path: spec.template.spec.strategicPatches[1]
          pattern: "workload: gpu:NoSchedule"

  # Labels and annotations tests
  - it: should emit pool-level labels and annotations as KubeNodeConfig
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.global.machineConfig: {}
    asserts:
      - isKind:
          of: TalosConfigTemplate
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.template.spec.strategicPatches[1]
          pattern: "my-label: my-value"
      - matchRegex:
          path: spec.template.spec.strategicPatches[1]
          pattern: "my-annotation: my-annotation-value"

  # Test Talos version and image precedence
  - it: should make sure Talos version defined in nodepool's config takes precedence
    template: templates/talos/configtemplate.yaml
    set:
      talos.version: "global-talos-version"
      kommodity.nodepools.default.talos.version: "nodepool-talos-version"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.talosVersion
          value: "nodepool-talos-version"

  - it: should make sure Talos version defined in controlplane's config takes precedence
    template: templates/talos/controlplane.yaml
    set:
      talos.version: "global-talos-version"
      kommodity.controlplane.talos.version: "controlplane-talos-version"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.controlPlaneConfig.controlplane.talosVersion
          value: "controlplane-talos-version"

  - it: should make sure Talos image defined in nodepool's and controlplane's config takes precedence
    template: templates/provider/scaleway/machinetemplate.yaml
    set:
      talos.image: "global-talos-image"
      kommodity.controlplane.talos.imageName: "controlplane-talos-image"
      kommodity.nodepools.default.talos.imageName: "nodepool-talos-image"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.template.spec.image.name
          value: "controlplane-talos-image"
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.name
          value: "nodepool-talos-image"
        documentIndex: 1

  # AutoBootstrap extension tests
  - it: should include autoBootstrap extension when kommodity.network.ipv4.public is false
    template: templates/talos/controlplane.yaml
    set:
      kommodity.network.ipv4.public: false
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: spec.controlPlaneConfig.controlplane.strategicPatches
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "name: kommodity-autobootstrap"

  - it: should include autoBootstrap extension when enabled by default
    template: templates/talos/controlplane.yaml
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: spec.controlPlaneConfig.controlplane.strategicPatches
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]

          pattern: "name: kommodity-autobootstrap"

  - it: should not include autoBootstrap extension when disabled
    template: templates/talos/controlplane.yaml
    set:
      talos.autoBootstrap.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[1]
          pattern: "name: kommodity-autobootstrap"

  - it: should include autoBootstrap extension when kommodity.network.ipv4.public is true
    template: templates/talos/controlplane.yaml
    set:
      kommodity.network.ipv4.public: true
    asserts:
      - hasDocuments:
          count: 1
      - exists:
          path: spec.controlPlaneConfig.controlplane.strategicPatches
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "name: kommodity-autobootstrap"

  - it: should default quorumNodes to etcd quorum (floor(replicas/2)+1) when not set
    template: templates/talos/controlplane.yaml
    set:
      kommodity.controlplane.replicas: 3
      talos.autoBootstrap.quorumNodes: null
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_QUORUM_NODES=2"

  - it: should default quorumNodes to 3 for 5 replicas
    template: templates/talos/controlplane.yaml
    set:
      kommodity.controlplane.replicas: 5
      talos.autoBootstrap.quorumNodes: null
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_QUORUM_NODES=3"

  - it: should default quorumNodes to 1 for single-node CP
    template: templates/talos/controlplane.yaml
    set:
      kommodity.controlplane.replicas: 1
      talos.autoBootstrap.quorumNodes: null
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_QUORUM_NODES=1"

  - it: should use explicit quorumNodes when set
    template: templates/talos/controlplane.yaml
    set:
      kommodity.controlplane.replicas: 3
      talos.autoBootstrap.quorumNodes: 2
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_QUORUM_NODES=2"

  - it: should emit TALOS_AUTO_BOOTSTRAP_SCAN_CIDR when scanCIDR is set
    template: templates/talos/controlplane.yaml
    set:
      talos.autoBootstrap.scanCIDR: 10.0.0.0/24
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_SCAN_CIDR=10.0.0.0/24"

  - it: should not emit TALOS_AUTO_BOOTSTRAP_SCAN_CIDR when scanCIDR is empty
    template: templates/talos/controlplane.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[3]
          pattern: "TALOS_AUTO_BOOTSTRAP_SCAN_CIDR"

  - it: should auto-derive scanCIDR from controlplaneSubnet when scanCIDR is empty
    template: templates/talos/controlplane.yaml
    set:
      kommodity.network.ipv4.controlplaneSubnet.cidrBlock: 10.0.0.0/16
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_SCAN_CIDR=10.0.0.0/16"

  - it: should prefer explicit scanCIDR over controlplaneSubnet
    template: templates/talos/controlplane.yaml
    set:
      talos.autoBootstrap.scanCIDR: 10.0.0.0/24
      kommodity.network.ipv4.controlplaneSubnet.cidrBlock: 10.0.0.0/16
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_SCAN_CIDR=10.0.0.0/24"

  - it: should not emit scanCIDR when neither scanCIDR nor controlplaneSubnet is set
    template: templates/talos/controlplane.yaml
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[3]
          pattern: "TALOS_AUTO_BOOTSTRAP_SCAN_CIDR"

  - it: should emit TALOS_AUTO_BOOTSTRAP_SCAN_CONCURRENCY when scanConcurrency is set
    template: templates/talos/controlplane.yaml
    set:
      talos.autoBootstrap.scanConcurrency: 256
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "TALOS_AUTO_BOOTSTRAP_SCAN_CONCURRENCY=256"

  - it: should not emit TALOS_AUTO_BOOTSTRAP_SCAN_CONCURRENCY when scanConcurrency is 0
    template: templates/talos/controlplane.yaml
    set:
      talos.autoBootstrap.scanConcurrency: 0
    asserts:
      - hasDocuments:
          count: 1
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[3]
          pattern: "TALOS_AUTO_BOOTSTRAP_SCAN_CONCURRENCY"

  # Kubernetes version precedence test
  - it: should make sure Kubernetes version defined in controlplane's config takes precedence
    template: templates/talos/controlplane.yaml
    set:
      kubernetes.version: "global-kubernetes-version"
      kommodity.controlplane.kubernetes.version: "controlplane-kubernetes-version"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.version
          value: "controlplane-kubernetes-version"

  # InstanceVolumes tests
  - it: should emit UserVolumeConfig for worker instanceVolumes
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
          volumeType: partition
          grow: true
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "kind: UserVolumeConfig"
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "name: scratch"
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: 'volumeType: "partition"'
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "grow: true"
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "disk.model == 'scratch'"

  - it: should default volumeType to partition when omitted
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: 'volumeType: "partition"'

  - it: should suppress grow, minSize, maxSize for volumeType disk
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.dev_path == '/dev/sdb'"
          volumeType: disk
          grow: true
          minSize: 100GiB
          maxSize: 200GiB
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: 'volumeType: "disk"'
      - not: true
        matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "grow:"
      - not: true
        matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "minSize:"
      - not: true
        matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "maxSize:"

  - it: should emit UserVolumeConfig for controlplane instanceVolumes
    template: templates/talos/controlplane.yaml
    set:
      kommodity.controlplane.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
    asserts:
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "kind: UserVolumeConfig"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[4]
          pattern: "name: scratch"

  - it: should emit multiple UserVolumeConfig for multiple instanceVolumes
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
        - nameSuffix: cache
          diskSelector: "disk.transport == 'nvme'"
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "name: scratch"
      - matchRegex:
          path: spec.template.spec.strategicPatches[4]
          pattern: "name: cache"

  - it: should not emit UserVolumeConfig when instanceVolumes is unset
    template: templates/talos/configtemplate.yaml
    asserts:
      - not: true
        matchRegex:
          path: spec.template.spec.strategicPatches[0]
          pattern: "UserVolumeConfig"

  - it: should emit nodeID encryption by default on instanceVolumes
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
          encryption:
            provider: luks2
            lockToState: true
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "provider: luks2"
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "nodeID"
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "lockToState: true"

  - it: should default to KMS encryption when kms is enabled and keySource is omitted
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.kms.enabled: true
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
          encryption:
            provider: luks2
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[5]
          pattern: "provider: luks2"
      - matchRegex:
          path: spec.template.spec.strategicPatches[5]
          pattern: "endpoint: \"https://kms.example.com\""
      - not: true
        matchRegex:
          path: spec.template.spec.strategicPatches[5]
          pattern: "nodeID"

  - it: should use nodeID encryption when kms is enabled but keySource is explicitly nodeID
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.kms.enabled: true
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
          encryption:
            provider: luks2
            keySource: nodeID
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[5]
          pattern: "nodeID"
      - not: true
        matchRegex:
          path: spec.template.spec.strategicPatches[5]
          pattern: "kms:"

  - it: should not emit encryption when encryption block is omitted
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
          diskSelector: "disk.model == 'scratch'"
    asserts:
      - not: true
        matchRegex:
          path: spec.template.spec.strategicPatches[1]
          pattern: "luks2"

  - it: should fail when nameSuffix is missing from instanceVolumes
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - diskSelector: "disk.model == 'scratch'"
    asserts:
      - failedTemplate:
          errorMessage: "instanceVolumes[].nameSuffix is required (used as Talos volume name and /var/mnt/<name> mount path)"

  - it: should fail when diskSelector is missing from instanceVolumes
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.instanceVolumes:
        - nameSuffix: scratch
    asserts:
      - failedTemplate:
          errorMessage: "instanceVolumes[].diskSelector is required (CEL expression to match the target disk)"

  # additionalVolumes UserVolumeConfig tests
  - it: should emit UserVolumeConfig for worker additionalVolumes with nameSuffix
    template: templates/talos/configtemplate.yaml
    set:
      kommodity.nodepools.default.additionalVolumes:
        - nameSuffix: data
          size: 100
    asserts:
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
          pattern: "kind: UserVolumeConfig"
      - matchRegex:
          path: spec.template.spec.strategicPatches[3]
