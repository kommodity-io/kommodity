---
suite: test creation of resources for Azure cluster
values:
  - ../values.azure.yaml
release:
  name: test-cluster
  namespace: default
# resourceGroup defaults to the release name; no suite-level set needed.
templates:
  - templates/*
tests:
  # CAPI Cluster template tests
  - it: should make sure a Cluster is created with Azure infrastructureRef
    template: templates/provider/capi/cluster.yaml
    asserts:
      - isKind:
          of: Cluster
      - hasDocuments:
          count: 1
      - equal:
          path: spec.infrastructureRef.kind
          value: AzureCluster
      - equal:
          path: spec.infrastructureRef.apiVersion
          value: infrastructure.cluster.x-k8s.io/v1beta1
      - equal:
          path: spec.infrastructureRef.name
          value: test-cluster
      - equal:
          path: spec.infrastructureRef.namespace
          value: default

  - it: should not set ccm annotations when provider.azure.secret.name is unset
    template: templates/provider/capi/cluster.yaml
    set:
      kommodity.provider.azure.secret.name: null
    asserts:
      - notExists:
          path: metadata.annotations["kommodity.io/ccm-secret-name"]
      - notExists:
          path: metadata.annotations["kommodity.io/ccm-downstream-secret-name"]

  - it: should honour an explicit provider.azure.secret.name override for ccm-secret-name
    template: templates/provider/capi/cluster.yaml
    set:
      kommodity.provider.azure.secret.name: my-own-cloud-provider
    asserts:
      - equal:
          path: metadata.annotations["kommodity.io/ccm-secret-name"]
          value: my-own-cloud-provider
      - equal:
          path: metadata.annotations["kommodity.io/ccm-downstream-secret-name"]
          value: azure-cloud-provider

  - it: should not set ccm annotations when CCM is disabled
    template: templates/provider/capi/cluster.yaml
    set:
      kommodity.provider.cloudControllerManager.enabled: false
    asserts:
      - notExists:
          path: metadata.annotations["kommodity.io/ccm-secret-name"]
      - notExists:
          path: metadata.annotations["kommodity.io/ccm-downstream-secret-name"]

  # CAPI MachineDeployment template tests
  - it: should make sure a MachineDeployment is created for each nodepool
    template: templates/provider/capi/machinedeployment.yaml
    asserts:
      - isKind:
          of: MachineDeployment
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: "test-cluster-worker-default"
        documentIndex: 0
      - equal:
          path: spec.template.spec.infrastructureRef.kind
          value: AzureMachineTemplate
        documentIndex: 0
      - equal:
          path: spec.template.spec.infrastructureRef.apiVersion
          value: infrastructure.cluster.x-k8s.io/v1beta1
        documentIndex: 0

  - it: should create MachineDeployments for multiple nodepools
    template: templates/provider/capi/machinedeployment.yaml
    set:
      kommodity.nodepools.gpu.replicas: 2
      kommodity.nodepools.gpu.sku: Standard_NC6s_v3
      kommodity.nodepools.gpu.zones:
        - "2"
      kommodity.nodepools.gpu.os.disk.size: 50
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: "test-cluster-worker-default"
        documentIndex: 0
      - equal:
          path: metadata.name
          value: "test-cluster-worker-gpu-2"
        documentIndex: 1
      - equal:
          path: spec.replicas
          value: 2
        documentIndex: 1
      - equal:
          path: spec.template.spec.infrastructureRef.kind
          value: AzureMachineTemplate
        documentIndex: 1

  - it: should set failureDomain from nodepool zone (quoted string)
    template: templates/provider/capi/machinedeployment.yaml
    set:
      kommodity.nodepools.default.zones:
        - "1"
    asserts:
      - equal:
          path: spec.template.spec.failureDomain
          value: "1"
        documentIndex: 0

  # AzureCluster template tests (complementing azure_cluster_test.yaml)
  - it: should create an AzureCluster with correct apiVersion
    template: templates/provider/azure/cluster.yaml
    asserts:
      - isKind:
          of: AzureCluster
      - hasDocuments:
          count: 1
      - equal:
          path: apiVersion
          value: infrastructure.cluster.x-k8s.io/v1beta1

  # AzureMachineTemplate tests
  - it: should create AzureMachineTemplates for controlplane and nodepools
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - isKind:
          of: AzureMachineTemplate
      - hasDocuments:
          count: 2
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-controlplane-[a-f0-9]{6}$
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$
        documentIndex: 1

  - it: should set vmSize for controlplane from sku
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - equal:
          path: spec.template.spec.vmSize
          value: Standard_D2s_v3
        documentIndex: 0

  - it: should set vmSize for worker from nodepool sku
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - equal:
          path: spec.template.spec.vmSize
          value: Standard_D2s_v3
        documentIndex: 1

  - it: should configure osDisk for controlplane
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - equal:
          path: spec.template.spec.osDisk.diskSizeGB
          value: 30
        documentIndex: 0
      - equal:
          path: spec.template.spec.osDisk.osType
          value: Linux
        documentIndex: 0
      - equal:
          path: spec.template.spec.osDisk.managedDisk.storageAccountType
          value: Premium_LRS
        documentIndex: 0

  - it: should configure osDisk for worker nodepool
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - equal:
          path: spec.template.spec.osDisk.diskSizeGB
          value: 30
        documentIndex: 1
      - equal:
          path: spec.template.spec.osDisk.osType
          value: Linux
        documentIndex: 1
      - equal:
          path: spec.template.spec.osDisk.managedDisk.storageAccountType
          value: Premium_LRS
        documentIndex: 1

  - it: should use custom osDisk type when specified
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.controlplane.os.disk.type: StandardSSD_LRS
      kommodity.nodepools.default.os.disk.type: Standard_LRS
    asserts:
      - equal:
          path: spec.template.spec.osDisk.managedDisk.storageAccountType
          value: StandardSSD_LRS
        documentIndex: 0
      - equal:
          path: spec.template.spec.osDisk.managedDisk.storageAccountType
          value: Standard_LRS
        documentIndex: 1

  - it: should create dataDisks for worker when additionalVolumes configured
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.nodepools.default.additionalVolumes:
        - nameSuffix: data
          size: 100
          lun: 0
          storageClassName: Premium_LRS
          cachingType: ReadWrite
    asserts:
      - notExists:
          path: spec.template.spec.dataDisks
        documentIndex: 0
      - equal:
          path: spec.template.spec.dataDisks[0].nameSuffix
          value: data
        documentIndex: 1
      - equal:
          path: spec.template.spec.dataDisks[0].diskSizeGB
          value: 100
        documentIndex: 1
      - equal:
          path: spec.template.spec.dataDisks[0].lun
          value: 0
        documentIndex: 1
      - equal:
          path: spec.template.spec.dataDisks[0].managedDisk.storageAccountType
          value: Premium_LRS
        documentIndex: 1
      - equal:
          path: spec.template.spec.dataDisks[0].cachingType
          value: ReadWrite
        documentIndex: 1

  - it: should create dataDisks for controlplane when additionalVolumes configured
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.controlplane.additionalVolumes:
        - nameSuffix: data
          size: 64
          lun: 0
          storageClassName: Premium_LRS
          cachingType: ReadWrite
    asserts:
      - equal:
          path: spec.template.spec.dataDisks[0].nameSuffix
          value: data
        documentIndex: 0
      - equal:
          path: spec.template.spec.dataDisks[0].diskSizeGB
          value: 64
        documentIndex: 0
      - equal:
          path: spec.template.spec.dataDisks[0].lun
          value: 0
        documentIndex: 0
      - equal:
          path: spec.template.spec.dataDisks[0].managedDisk.storageAccountType
          value: Premium_LRS
        documentIndex: 0
      - equal:
          path: spec.template.spec.dataDisks[0].cachingType
          value: ReadWrite
        documentIndex: 0
      - notExists:
          path: spec.template.spec.dataDisks
        documentIndex: 1

  - it: should omit networkInterfaces when acceleratedNetworking is not set
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - notExists:
          path: spec.template.spec.networkInterfaces
        documentIndex: 0
      - notExists:
          path: spec.template.spec.networkInterfaces
        documentIndex: 1

  - it: should set acceleratedNetworking on controlplane and nodepool when configured
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.controlplane.acceleratedNetworking: false
      kommodity.nodepools.default.acceleratedNetworking: false
    asserts:
      - equal:
          path: spec.template.spec.networkInterfaces[0].acceleratedNetworking
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.networkInterfaces[0].acceleratedNetworking
          value: false
        documentIndex: 1

  - it: should render acceleratedNetworking true when explicitly enabled
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.controlplane.acceleratedNetworking: true
      kommodity.nodepools.default.acceleratedNetworking: true
    asserts:
      - equal:
          path: spec.template.spec.networkInterfaces[0].acceleratedNetworking
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.networkInterfaces[0].acceleratedNetworking
          value: true
        documentIndex: 1

  - it: should mint a new AzureMachineTemplate when acceleratedNetworking is set
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.nodepools.default.acceleratedNetworking: false
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$
        documentIndex: 1

  - it: should mint a new AzureMachineTemplate when additionalVolumes change
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.nodepools.default.additionalVolumes:
        - nameSuffix: data
          size: 100
          lun: 0
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$
        documentIndex: 1

  - it: should default managedDisk.storageAccountType to Premium_LRS when storageClassName omitted
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.nodepools.default.additionalVolumes:
        - nameSuffix: data
          size: 100
          lun: 0
    asserts:
      - equal:
          path: spec.template.spec.dataDisks[0].managedDisk.storageAccountType
          value: Premium_LRS
        documentIndex: 1

  - it: should create multiple AzureMachineTemplates for multiple nodepools
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.nodepools.gpu.replicas: 1
      kommodity.nodepools.gpu.sku: Standard_NC6s_v3
      kommodity.nodepools.gpu.zones:
        - "2"
      kommodity.nodepools.gpu.os.disk.size: 50
      kommodity.nodepools.gpu.os.disk.type: Premium_LRS
    asserts:
      - hasDocuments:
          count: 3
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-controlplane-[a-f0-9]{6}$
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$
        documentIndex: 1
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-gpu-[a-f0-9]{6}$
        documentIndex: 2
      - equal:
          path: spec.template.spec.vmSize
          value: Standard_NC6s_v3
        documentIndex: 2
      - equal:
          path: spec.template.spec.osDisk.diskSizeGB
          value: 50
        documentIndex: 2

  # Scaleway-aligned: provide only talos.imageName; the chart builds the managed
  # image ARM ID from the subscription + talosImageResourceGroup config.
  - it: should build the image id from imageName + talosImageResourceGroup
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.subscriptionID: sub-1234
      kommodity.provider.azure.talosImageResourceGroup: shared-images-rg
      talos.imageName: kommodity-talos-azure-v1.14.2
    asserts:
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-1234/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-v1.14.2
        documentIndex: 0
      # The same built id is used for worker nodepools.
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-1234/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-v1.14.2
        documentIndex: 1

  # Per-pool image selection (mirrors Hetzner/Scaleway/KubeVirt pool overrides):
  # a nodepool may boot a different Talos image than the global one.
  - it: should build a per-pool image id from nodepool talos.imageName
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.subscriptionID: sub-1234
      kommodity.provider.azure.talosImageResourceGroup: shared-images-rg
      talos.imageName: kommodity-talos-azure-v1.14.2
      kommodity.nodepools.default.talos.imageName: kommodity-talos-azure-gpu-v1.14.2
    asserts:
      # Control plane keeps the global image.
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-1234/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-v1.14.2
        documentIndex: 0
      # The nodepool image wins over the global one, reusing the global
      # subscriptionID + talosImageResourceGroup.
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-1234/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-gpu-v1.14.2
        documentIndex: 1
      # The per-pool image identity mints a different template name than the
      # control plane's (infra templates are immutable per CAPZ).
      - matchRegex:
          path: metadata.name
          pattern: ^test-cluster-worker-default-[a-f0-9]{6}$
        documentIndex: 1

  # A pool-level escape hatch (full ARM id) overrides the global imageName.
  - it: should let a nodepool override the image with an explicit talos.id
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.subscriptionID: sub-1234
      kommodity.provider.azure.talosImageResourceGroup: shared-images-rg
      talos.imageName: kommodity-talos-azure-v1.14.2
      kommodity.nodepools.default.talos.id: /subscriptions/gpu-sub/resourceGroups/gpu-rg/providers/Microsoft.Compute/images/gpu-image
    asserts:
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-1234/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-v1.14.2
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/gpu-sub/resourceGroups/gpu-rg/providers/Microsoft.Compute/images/gpu-image
        documentIndex: 1

  # Pool A's override must not leak into pool B (no live-values mutation) and
  # must not leak global image keys into other pools' machine config blocks.
  - it: should keep per-pool image overrides isolated across nodepools
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.subscriptionID: sub-1234
      kommodity.provider.azure.talosImageResourceGroup: shared-images-rg
      talos.imageName: kommodity-talos-azure-v1.14.2
      kommodity.nodepools:
        gpu:
          replicas: 1
          sku: Standard_NC6s_v3
          os:
            disk:
              size: 50
              type: Premium_LRS
          talos:
            imageName: kommodity-talos-azure-gpu-v1.14.2
    asserts:
      # Map range renders pools in alphabetical key order: default (doc 1),
      # gpu (doc 2). The untouched default pool must still boot the global
      # image while the gpu pool overrides it — proving no cross-pool leak.
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-3cc5c9
        documentIndex: 1
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-1234/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-v1.14.2
        documentIndex: 1
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-1234/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-gpu-v1.14.2
        documentIndex: 2

  # Regression (0.40): a pool-level image override must roll the template
  # name, not just the rendered image. Pre-0.40, talosImageName already
  # hashed a pool talos.imageName while the rendered image stayed global —
  # upgrading without a hash roll would mutate the immutable template.
  - it: should hash a per-pool image override into the template name
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.subscriptionID: sub-0400
      kommodity.provider.azure.talosImageResourceGroup: shared-images-rg
      talos.imageName: kommodity-talos-azure-v1.14.2
      kommodity.nodepools.default.talos.imageName: kommodity-talos-azure-gpu-v1.15.0
    asserts:
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/sub-0400/resourceGroups/shared-images-rg/providers/Microsoft.Compute/images/kommodity-talos-azure-gpu-v1.15.0
        documentIndex: 1
      # Exact pin: this hash includes the rendered pool image (azurePoolImage),
      # so reverting the fix produces a different name (pre-fix: c55bb9 — the
      # 0.39 hash input set, which hashed the pool imageName but rendered the
      # global image).
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-50052a
        documentIndex: 1

  # Regression (0.40): same-version identity changes must roll the name. The
  # identity list hashes only version/id/RG, so a gallery name change at the
  # same version changes the rendered image without any identity change.
  - it: should roll the template name for a same-version gallery name override
    template: templates/provider/azure/machinetemplate.yaml
    set:
      talos.computeGallery:
        gallery: kommodity-gallery
        name: gallery-a
        version: 1.14.2
      kommodity.nodepools.default.talos.computeGallery:
        gallery: kommodity-gallery
        name: gallery-b
        version: 1.14.2
      kommodity.nodepools.gpu.talos.computeGallery:
        gallery: kommodity-gallery
        name: gallery-c
        version: 1.14.2
      kommodity.nodepools.gpu.sku: Standard_NC6s_v3
      kommodity.nodepools.gpu.os:
        disk:
          size: 50
          type: Premium_LRS
    asserts:
      # Control plane and the untouched gpu pool are rendered for context; the
      # pinned assertion target is the default pool (documentIndex 1): its
      # gallery-b differs from global gallery-a only by name (same version),
      # and the pin (not the pre-fix 9ba1d7 name) requires the rendered pool
      # image to be part of the hash.
      - equal:
          path: spec.template.spec.image.computeGallery.name
          value: gallery-a
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.computeGallery.name
          value: gallery-b
        documentIndex: 1
      - equal:
          path: spec.template.spec.image.computeGallery.name
          value: gallery-c
        documentIndex: 2
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-24f80c
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-cluster-worker-gpu-5cd915
        documentIndex: 2

  # Regression (0.40): a pool whose talos block equals the global one must
  # still hash its rendered image — if the blocks later change together
  # (e.g. both rename the gallery at the same version), the template name
  # must roll. A global-vs-pool comparison would omit the input in this
  # equality case and freeze the name.
  - it: should hash the pool image even when it matches the global image
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.subscriptionID: sub-1234
      talos.computeGallery.name: gallery-a
      talos.computeGallery.version: 1.14.2
      talos.computeGallery.gallery: kommodity-gallery
      kommodity.nodepools.default.talos.computeGallery.name: gallery-a
      kommodity.nodepools.default.talos.computeGallery.version: 1.14.2
      kommodity.nodepools.default.talos.computeGallery.gallery: kommodity-gallery
    asserts:
      - equal:
          path: spec.template.spec.image.computeGallery.name
          value: gallery-a
        documentIndex: 1
      # Exact pin: 0dce87 requires the pool's rendered image in the hash.
      # Renaming gallery-a to gallery-z in both blocks rolls the name (the
      # pool image changes); under the old global-vs-pool comparison the
      # input was omitted in this equality case and the name stayed frozen.
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-0dce87
        documentIndex: 1


  # Regression (0.40): with every pool overridden, the global talos block may
  # be unrenderable (imageName without talosImageResourceGroup) while the
  # effective pool images are valid. The hash must not render the global
  # image — only the pool's — or the whole chart fails to render.
  - it: should render pool id overrides when the unused global imageName lacks its resource group
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.subscriptionID: sub-1234
      kommodity.provider.azure.talosImageResourceGroup: null
      talos.imageName: global-image
      kommodity.controlplane.talos.id: /subscriptions/s/resourceGroups/rg/providers/Microsoft.Compute/images/cp
      kommodity.nodepools.default.talos.id: /subscriptions/s/resourceGroups/rg/providers/Microsoft.Compute/images/w
    asserts:
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/s/resourceGroups/rg/providers/Microsoft.Compute/images/cp
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-controlplane-9db11b
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/s/resourceGroups/rg/providers/Microsoft.Compute/images/w
        documentIndex: 1
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-bb46f8
        documentIndex: 1

  - it: should require talosImageResourceGroup when only imageName is set
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.azure.talosImageResourceGroup: null
      talos.imageName: kommodity-talos-azure-v1.14.2
    asserts:
      - failedTemplate:
          errorMessage: talos.imageName requires kommodity.provider.azure.talosImageResourceGroup (the resource group holding the Talos managed image) to build the Talos image resource ID

  # Escape hatch: an explicit full ARM id takes precedence over imageName.
  - it: should use an explicit image id when configured
    template: templates/provider/azure/machinetemplate.yaml
    set:
      talos.id: /subscriptions/explicit-sub/resourceGroups/explicit-rg/providers/Microsoft.Compute/images/explicit-image
    asserts:
      - equal:
          path: spec.template.spec.image.id
          value: /subscriptions/explicit-sub/resourceGroups/explicit-rg/providers/Microsoft.Compute/images/explicit-image
        documentIndex: 0

  - it: should use marketplace image when configured
    template: templates/provider/azure/machinetemplate.yaml
    set:
      talos.id: null
      talos.imageName: null
      talos.marketplace:
        publisher: siderolabs
        offer: talos
        sku: talos
        version: 1.13.0
    asserts:
      - equal:
          path: spec.template.spec.image.marketplace.publisher
          value: siderolabs
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.marketplace.offer
          value: talos
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.marketplace.sku
          value: talos
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.marketplace.version
          value: 1.13.0
        documentIndex: 0

  - it: should use computeGallery image when configured
    template: templates/provider/azure/machinetemplate.yaml
    set:
      talos.id: null
      talos.computeGallery:
        gallery: myGallery
        name: talos-image
        version: 1.13.0
        subscriptionID: my-subscription
        resourceGroup: my-rg
    asserts:
      - equal:
          path: spec.template.spec.image.computeGallery.gallery
          value: myGallery
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.computeGallery.name
          value: talos-image
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.computeGallery.version
          value: 1.13.0
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.computeGallery.subscriptionID
          value: my-subscription
        documentIndex: 0
      - equal:
          path: spec.template.spec.image.computeGallery.resourceGroup
          value: my-rg
        documentIndex: 0

  # Regression: a computeGallery version bump must mint a DIFFERENT template
  # hash per document (infra templates are immutable per CAPZ), for both the
  # control-plane and worker documents.
  - it: should mint different AzureMachineTemplate names per computeGallery version
    template: templates/provider/azure/machinetemplate.yaml
    set:
      talos.id: null
      talos.computeGallery:
        gallery: myGallery
        name: talos-image
        version: 1.13.0
        subscriptionID: my-subscription
        resourceGroup: my-rg
    asserts:
      - equal:
          path: metadata.name
          value: test-cluster-controlplane-3416ca
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-3416ca
        documentIndex: 1
  - it: should change the AzureMachineTemplate name when the gallery version changes
    template: templates/provider/azure/machinetemplate.yaml
    set:
      talos.id: null
      talos.computeGallery:
        gallery: myGallery
        name: talos-image
        version: 1.13.2
        subscriptionID: my-subscription
        resourceGroup: my-rg
    asserts:
      - equal:
          path: metadata.name
          value: test-cluster-controlplane-3d3c12
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-3d3c12
        documentIndex: 1
  - it: should set disableExtensionOperations to true by default
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - equal:
          path: spec.template.spec.disableExtensionOperations
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.disableExtensionOperations
          value: true
        documentIndex: 1

  - it: should allow overriding disableExtensionOperations to false
    template: templates/provider/azure/machinetemplate.yaml
    set:
      azure.disableExtensionOperations: false
    asserts:
      - equal:
          path: spec.template.spec.disableExtensionOperations
          value: false
        documentIndex: 0
      - equal:
          path: spec.template.spec.disableExtensionOperations
          value: false
        documentIndex: 1

  - it: should render an empty sshPublicKey by default
    template: templates/provider/azure/machinetemplate.yaml
    asserts:
      - equal:
          path: spec.template.spec.sshPublicKey
          value: ""
        documentIndex: 0
      - equal:
          path: spec.template.spec.sshPublicKey
          value: ""
        documentIndex: 1

  - it: should omit sshPublicKey when disableSSHPublicKey is set
    template: templates/provider/azure/machinetemplate.yaml
    set:
      azure.disableSSHPublicKey: true
    asserts:
      - notExists:
          path: spec.template.spec.sshPublicKey
        documentIndex: 0
      - notExists:
          path: spec.template.spec.sshPublicKey
        documentIndex: 1

  - it: should still render sshPublicKey when disableSSHPublicKey is false
    template: templates/provider/azure/machinetemplate.yaml
    set:
      azure.disableSSHPublicKey: false
      azure.sshPublicKey: my-key
    asserts:
      - equal:
          path: spec.template.spec.sshPublicKey
          value: my-key
        documentIndex: 0
      - equal:
          path: spec.template.spec.sshPublicKey
          value: my-key
        documentIndex: 1

  - it: should not render AzureMachineTemplates for non-Azure providers
    template: templates/provider/azure/machinetemplate.yaml
    set:
      kommodity.provider.name: Docker
      kommodity.provider.cloudControllerManager.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # TalosControlPlane template tests
  - it: should create TalosControlPlane with AzureMachineTemplate infrastructureTemplate
    template: templates/talos/controlplane.yaml
    asserts:
      - isKind:
          of: TalosControlPlane
      - hasDocuments:
          count: 1
      - equal:
          path: spec.infrastructureTemplate.kind
          value: AzureMachineTemplate
      - equal:
          path: spec.infrastructureTemplate.apiVersion
          value: infrastructure.cluster.x-k8s.io/v1beta1
      - matchRegex:
          path: spec.infrastructureTemplate.name
          pattern: ^test-cluster-controlplane-[a-f0-9]{6}$

  - it: should set controlplane replicas correctly
    template: templates/talos/controlplane.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should set controlplane replicas from values
    template: templates/talos/controlplane.yaml
    set:
      kommodity.controlplane.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should not include anonymous-auth in controlplane strategicPatches
    template: templates/talos/controlplane.yaml
    asserts:
      - notMatchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[0]
          pattern: "anonymous-auth"

  # CCM CRS tests — CCM manifest is delivered via ClusterResourceSet, not inlineManifests
  - it: should render ConfigMap and ClusterResourceSet for Azure CCM
    template: templates/ccm-crs.yaml
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: test-cluster-ccm-manifests
          namespace: default
        documentIndex: 0
      - containsDocument:
          kind: ClusterResourceSet
          apiVersion: addons.cluster.x-k8s.io/v1beta1
          name: test-cluster-ccm
          namespace: default
        documentIndex: 1

  - it: should embed azure-cloud-node-manager image in CCM ConfigMap
    template: templates/ccm-crs.yaml
    set:
      kommodity.provider.cloudControllerManager.image.repository: mcr.microsoft.com/oss/kubernetes/azure-cloud-controller-manager
      kommodity.provider.cloudControllerManager.image.tag: v1.34.3
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["ccm.yaml"]
          pattern: "image: mcr.microsoft.com/oss/kubernetes/azure-cloud-controller-manager:v1.34.3"

  - it: should not render CCM resources when cloudControllerManager is disabled
    template: templates/ccm-crs.yaml
    set:
      kommodity.provider.cloudControllerManager.enabled: false
    asserts:
      - hasDocuments:
          count: 0
