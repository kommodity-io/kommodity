suite: test creation of resources for Byot (Bring Your Own Talos) clusters
values:
  - ../values.byot.yaml
release:
  name: test-cluster
  namespace: default
templates:
  - templates/*
tests:
  - it: should create a ByotCluster with the control plane endpoint from the first static machine
    template: templates/provider/byot/cluster.yaml
    asserts:
      - isKind:
          of: ByotCluster
      - hasDocuments:
          count: 1
      - equal:
          path: spec.controlPlaneEndpoint.host
          value: 203.0.113.10
      - equal:
          path: spec.controlPlaneEndpoint.port
          value: 6443

  - it: should override the control plane endpoint host and port when both are set
    template: templates/provider/byot/cluster.yaml
    set:
      kommodity.provider.config.endpoint.host: 198.51.100.5
      kommodity.provider.config.endpoint.port: 7443
    asserts:
      - equal:
          path: spec.controlPlaneEndpoint.host
          value: 198.51.100.5
      - equal:
          path: spec.controlPlaneEndpoint.port
          value: 7443

  - it: should keep the init machine endpoint host when only endpoint.port is overridden
    template: templates/provider/byot/cluster.yaml
    set:
      kommodity.provider.config.endpoint.port: 7443
    asserts:
      - equal:
          path: spec.controlPlaneEndpoint.host
          value: 203.0.113.10
      - equal:
          path: spec.controlPlaneEndpoint.port
          value: 7443

  - it: should set infrastructureRef to ByotCluster and omit controlPlaneRef on the Cluster
    template: templates/provider/capi/cluster.yaml
    asserts:
      - isKind:
          of: Cluster
      - equal:
          path: spec.infrastructureRef.kind
          value: ByotCluster
      - notExists:
          path: spec.controlPlaneRef

  - it: should create one TalosConfig + ByotMachine + Machine per static machine
    template: templates/provider/byot/machines.yaml
    asserts:
      - hasDocuments:
          count: 6

  - it: should mark the init control plane static machine TalosConfig as init
    template: templates/provider/byot/machines.yaml
    documentSelector:
      path: spec.generateType
      value: init
    asserts:
      - equal:
          path: metadata.name
          value: test-cluster-cp-cp-0

  - it: should mark the worker static machine TalosConfig as worker
    template: templates/provider/byot/machines.yaml
    documentSelector:
      path: spec.generateType
      value: worker
    asserts:
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-worker-0

  - it: should adopt the control plane machine by public IP
    template: templates/provider/byot/machines.yaml
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.10
    asserts:
      - isKind:
          of: ByotMachine
      - equal:
          path: metadata.name
          value: test-cluster-cp-cp-0

  - it: should label the control plane Machine as control-plane
    template: templates/provider/byot/machines.yaml
    documentSelector:
      path: metadata.labels["cluster.x-k8s.io/control-plane"]
      value: ""
    asserts:
      - isKind:
          of: Machine
      - equal:
          path: metadata.name
          value: test-cluster-cp-cp-0

  - it: should not create a TalosControlPlane for Byot
    template: templates/talos/controlplane.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create MachineDeployments for Byot
    template: templates/provider/capi/machinedeployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create TalosConfigTemplates for Byot
    template: templates/talos/configtemplate.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render talosConfigSecretRef on the ByotMachine when set
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.staticMachines.cp-0.talosConfigSecretRef.name: old-talosconfig
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.10
    asserts:
      - isKind:
          of: ByotMachine
      - equal:
          path: spec.talosConfigSecretRef.name
          value: old-talosconfig

  - it: should omit talosConfigSecretRef on the ByotMachine when unset
    template: templates/provider/byot/machines.yaml
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.10
    asserts:
      - isKind:
          of: ByotMachine
      - notExists:
          path: spec.talosConfigSecretRef

  - it: should render policies set per static machine
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.staticMachines.cp-0.joinPolicy: Reset
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.10
    asserts:
      - isKind:
          of: ByotMachine
      - equal:
          path: spec.joinPolicy
          value: Reset
      - equal:
          path: spec.splitPolicy
          value: None

  - it: should inherit policies from the controlplane block
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.joinPolicy: Reset
      kommodity.controlplane.splitPolicy: Reset
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.10
    asserts:
      - isKind:
          of: ByotMachine
      - equal:
          path: spec.joinPolicy
          value: Reset
      - equal:
          path: spec.splitPolicy
          value: Reset

  - it: should let static machine policies override the controlplane block
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.joinPolicy: Reset
      kommodity.controlplane.staticMachines.cp-0.splitPolicy: Reset
      kommodity.controlplane.staticMachines.cp-0.joinPolicy: None
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.10
    asserts:
      - isKind:
          of: ByotMachine
      - equal:
          path: spec.joinPolicy
          value: None
      - equal:
          path: spec.splitPolicy
          value: Reset

  - it: should inherit policies from the nodepool block for workers
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.nodepools.default.splitPolicy: Reset
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.20
    asserts:
      - isKind:
          of: ByotMachine
      - equal:
          path: spec.splitPolicy
          value: Reset

  - it: should not inherit controlplane policies into nodepools
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.joinPolicy: Reset
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.20
    asserts:
      - isKind:
          of: ByotMachine
      - notExists:
          path: spec.joinPolicy

  - it: should omit policies on the ByotMachine when unset
    template: templates/provider/byot/machines.yaml
    documentSelector:
      path: spec.publicIP
      value: 203.0.113.10
    asserts:
      - isKind:
          of: ByotMachine
      - notExists:
          path: spec.joinPolicy
      - notExists:
          path: spec.splitPolicy

  - it: should fail on an invalid joinPolicy
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.staticMachines.cp-0.joinPolicy: Wipe
    asserts:
      - failedTemplate:
          errorMessage: 'kommodity.controlplane.staticMachines.cp-0.joinPolicy must be None or Reset, got "Wipe"'

  - it: should fail when no control plane machine is marked init
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.staticMachines.cp-0.init: null
    asserts:
      - failedTemplate:
          errorMessage: "kommodity.controlplane.staticMachines: exactly one entry must set init: true (bootstrap node), got 0"

  - it: should fail when a static control plane machine lacks publicIP
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.controlplane.staticMachines.cp-0.publicIP: null
    asserts:
      - failedTemplate:
          errorMessage: "kommodity.controlplane.staticMachines.cp-0 requires publicIP"

  - it: should fail when a static worker machine lacks publicIP
    template: templates/provider/byot/machines.yaml
    set:
      kommodity.nodepools.default.staticMachines.worker-0.publicIP: null
    asserts:
      - failedTemplate:
          errorMessage: "kommodity.nodepools.default.staticMachines.worker-0 requires publicIP"

  - it: should render a control-plane MachineHealthCheck selecting the control-plane machines
    template: templates/provider/capi/machinehealthcheck.yaml
    documentSelector:
      path: metadata.name
      value: test-cluster-controlplane
    asserts:
      - isKind:
          of: MachineHealthCheck
      - equal:
          path: spec.selector.matchLabels["cluster.x-k8s.io/control-plane"]
          value: ""

  - it: should render a worker MachineHealthCheck selecting by nodepool label
    template: templates/provider/capi/machinehealthcheck.yaml
    documentSelector:
      path: metadata.name
      value: test-cluster-worker-default
    asserts:
      - isKind:
          of: MachineHealthCheck
      - equal:
          path: spec.selector.matchLabels["kommodity.io/nodepool"]
          value: default
      - equal:
          path: spec.selector.matchLabels["cluster.x-k8s.io/cluster-name"]
          value: test-cluster

  - it: should label the worker Machine with its nodepool for health-check selection
    template: templates/provider/byot/machines.yaml
    documentSelector:
      path: metadata.labels["kommodity.io/nodepool"]
      value: default
    asserts:
      - isKind:
          of: Machine
      - equal:
          path: metadata.name
          value: test-cluster-worker-default-worker-0
