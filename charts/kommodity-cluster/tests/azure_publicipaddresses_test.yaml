---
suite: test Azure standalone PublicIPAddress resources for Envoy gateway LoadBalancer Services
values:
  - ../values.azure.yaml
release:
  name: test-cluster
  namespace: default
templates:
  - templates/provider/azure/publicipaddresses.yaml
tests:
  # Opt-in: nothing is emitted by default (values.azure.yaml has no
  # publicIPAddresses block).
  - it: should not render any documents by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for non-Azure providers
    set:
      kommodity.provider.name: Scaleway
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one PublicIPAddress when a single PIP is configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    asserts:
      - hasDocuments:
          count: 1

  - it: should render multiple PublicIPAddresses when multiple PIPs are configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
        - name: ingress-controller
    asserts:
      - hasDocuments:
          count: 2

  - it: should render PublicIPAddress with correct fields
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    documentIndex: 0
    asserts:
      - isKind:
          of: PublicIPAddress
      - equal:
          path: apiVersion
          value: network.azure.com/v1api20240301
      - equal:
          path: metadata.name
          value: pip-test-cluster-envoy-gateway
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: metadata.annotations["serviceoperator.azure.com/credential-from"]
          value: test-cluster-aso-secret
      # Must NOT carry resource-policy:keep — these ASO CRs are chart-owned
      # and helm uninstall must delete them so ASO removes the Azure PIP.
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
      - equal:
          path: spec.azureName
          value: pip-test-cluster-envoy-gateway
      - equal:
          path: spec.location
          value: westeurope
      - equal:
          path: spec.owner.name
          value: test-cluster
      - equal:
          path: spec.publicIPAllocationMethod
          value: Static
      - equal:
          path: spec.sku.name
          value: Standard

  - it: should use the resourceGroup from config when set
    set:
      kommodity.provider.config.resourceGroup: my-custom-rg
      kommodity.provider.config.allowSharedResourceGroup: true
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    documentIndex: 0
    asserts:
      - equal:
          path: spec.owner.name
          value: my-custom-rg

  - it: should include zones when configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
          zones:
            - "1"
            - "2"
    documentIndex: 0
    asserts:
      - equal:
          path: spec.zones[0]
          value: "1"
      - equal:
          path: spec.zones[1]
          value: "2"

  - it: should include tags when configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
          tags:
            managed-by: kommodity
            env: production
    documentIndex: 0
    asserts:
      - equal:
          path: spec.tags["managed-by"]
          value: kommodity
      - equal:
          path: spec.tags["env"]
          value: production

  - it: should omit zones when not configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.zones

  - it: should omit tags when not configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.tags

  - it: should render in public mode
    set:
      kommodity.network.ipv4.public: true
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    asserts:
      - hasDocuments:
          count: 1

  - it: should render in private BYO-VNet mode
    set:
      kommodity.network.ipv4.public: false
      kommodity.network.ipv4.vnet.name: my-vnet
      kommodity.network.ipv4.vnet.resourceGroup: my-vnet-rg
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
    asserts:
      - hasDocuments:
          count: 1

  - it: should fail when a PIP entry is missing a name
    set:
      kommodity.provider.azure.publicIPAddresses:
        - zones:
            - "1"
    asserts:
      - failedTemplate:
          errorMessage: "each entry in kommodity.provider.azure.publicIPAddresses must have a 'name'"

  - it: should render the second PIP with correct name
    set:
      kommodity.provider.azure.publicIPAddresses:
        - name: envoy-gateway
        - name: ingress-controller
    documentIndex: 1
    asserts:
      - isKind:
          of: PublicIPAddress
      - equal:
          path: metadata.name
          value: pip-test-cluster-ingress-controller
      - equal:
          path: spec.azureName
          value: pip-test-cluster-ingress-controller
