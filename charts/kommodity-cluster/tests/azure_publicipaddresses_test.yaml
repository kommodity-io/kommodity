---
suite: test Azure standalone PublicIPAddress resources for Envoy gateway LoadBalancer Services
values:
  - ../values.azure.yaml
release:
  name: test-cluster
  namespace: default
templates:
  - templates/provider/azure/publicipaddresses.yaml
tests:
  # Opt-in: nothing is emitted by default (values.azure.yaml has no
  # publicIPAddresses block).
  - it: should not render any documents by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for non-Azure providers
    set:
      kommodity.provider.name: Scaleway
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one PublicIPAddress when a single PIP is configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    asserts:
      - hasDocuments:
          count: 1

  - it: should render multiple PublicIPAddresses when multiple PIPs are configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
        ingress-controller: {}
    asserts:
      - hasDocuments:
          count: 2

  # The map key IS the full Azure resource name (CR name + azureName): the PIP
  # lives in the cluster's own resource group, so no release-name prefix.
  - it: should render PublicIPAddress with correct fields
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    documentIndex: 0
    asserts:
      - isKind:
          of: PublicIPAddress
      - equal:
          path: apiVersion
          value: network.azure.com/v1api20240301
      - equal:
          path: metadata.name
          value: envoy-gateway
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: metadata.annotations["serviceoperator.azure.com/credential-from"]
          value: test-cluster-aso-secret
      # Must NOT carry resource-policy:keep — these ASO CRs are chart-owned
      # and helm uninstall must delete them so ASO removes the Azure PIP.
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
      - equal:
          path: spec.azureName
          value: envoy-gateway
      - equal:
          path: spec.location
          value: westeurope
      - equal:
          path: spec.owner.name
          value: test-cluster
      - equal:
          path: spec.publicIPAllocationMethod
          value: Static
      - equal:
          path: spec.sku.name
          value: Standard

  - it: should use the resourceGroup from config when set
    set:
      kommodity.provider.config.resourceGroup: my-custom-rg
      kommodity.provider.config.allowSharedResourceGroup: true
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    documentIndex: 0
    asserts:
      - equal:
          path: spec.owner.name
          value: my-custom-rg

  - it: should include zones when configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway:
          zones:
            - "1"
            - "2"
    documentIndex: 0
    asserts:
      - equal:
          path: spec.zones[0]
          value: "1"
      - equal:
          path: spec.zones[1]
          value: "2"

  - it: should include tags when configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway:
          tags:
            managed-by: kommodity
            env: production
    documentIndex: 0
    asserts:
      - equal:
          path: spec.tags["managed-by"]
          value: kommodity
      - equal:
          path: spec.tags["env"]
          value: production

  - it: should omit zones when not configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.zones

  - it: should omit tags when not configured
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.tags

  - it: should render in public mode
    set:
      kommodity.network.ipv4.public: true
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    asserts:
      - hasDocuments:
          count: 1

  - it: should render in private BYO-VNet mode
    set:
      kommodity.network.ipv4.public: false
      kommodity.network.ipv4.vnet.name: my-vnet
      kommodity.network.ipv4.vnet.resourceGroup: my-vnet-rg
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway: {}
    asserts:
      - hasDocuments:
          count: 1

  # enabled defaults to true; an entry with enabled: false is skipped so the
  # CR (and its Azure PublicIP) is removed on the next upgrade. This is the
  # overlay-friendly disable path: Helm deep-merges maps across -f files, so
  # an overlay can disable one base PIP without re-specifying the whole map.
  - it: "should skip a PIP with enabled: false"
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway:
          enabled: false
        ingress-controller: {}
    asserts:
      - hasDocuments:
          count: 1
      # Sorted key order: envoy-gateway is skipped, ingress-controller renders
      # as the only (first) document.
      - equal:
          path: metadata.name
          value: ingress-controller

  - it: "should render a PIP with enabled: true"
    set:
      kommodity.provider.azure.publicIPAddresses:
        envoy-gateway:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: envoy-gateway

  # Map iteration in Go templates ranges over sorted keys, so the render order
  # (and the documentIndex) is deterministic regardless of values-file ordering.
  - it: should render the alphabetically-first PIP at documentIndex 0
    set:
      kommodity.provider.azure.publicIPAddresses:
        zeta-gateway: {}
        alpha-gateway: {}
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: alpha-gateway

  - it: should render the alphabetically-later PIP at documentIndex 1
    set:
      kommodity.provider.azure.publicIPAddresses:
        zeta-gateway: {}
        alpha-gateway: {}
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: zeta-gateway
      - equal:
          path: spec.azureName
          value: zeta-gateway

  # All-numeric map keys pass DNS-1123 but decode as YAML ints when rendered
  # unquoted — the CR name would arrive at the API server as an integer and be
  # rejected. | quote preserves the string type.
  - it: "should quote a numeric PIP key so it stays a string"
    set:
      kommodity.provider.azure.publicIPAddresses:
        "123": {}
    documentIndex: 0
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^123$'
      - matchRegex:
          path: spec.azureName
          pattern: '^123$'


  # Map keys become the CR metadata.name, so invalid DNS-1123 keys must
  # fail at render time with an actionable message instead of surfacing as a
  # cryptic CR-admission error at install time.
  - it: "should fail on an invalid DNS-1123 key (underscore)"
    set:
      kommodity.provider.azure.publicIPAddresses:
        my_pip: {}
    asserts:
      - failedTemplate:
          errorMessage: "invalid PublicIP key \"my_pip\" in kommodity.provider.azure.publicIPAddresses: map keys become the PublicIPAddress resource name and must be valid DNS-1123 subdomains (lowercase alphanumeric, '-' and '.', max 253 chars total, max 63 chars per dot-separated label). An invalid key otherwise fails at CR admission with a cryptic error far from the values file."

  - it: "should fail on an invalid DNS-1123 key (uppercase)"
    set:
      kommodity.provider.azure.publicIPAddresses:
        My-Pip: {}
    asserts:
      - failedTemplate:
          errorMessage: "invalid PublicIP key \"My-Pip\" in kommodity.provider.azure.publicIPAddresses: map keys become the PublicIPAddress resource name and must be valid DNS-1123 subdomains (lowercase alphanumeric, '-' and '.', max 253 chars total, max 63 chars per dot-separated label). An invalid key otherwise fails at CR admission with a cryptic error far from the values file."

  # DNS-1123 subdomains cap each dot-separated label at 63 chars; a longer
  # single label would pass a whole-string maxLength check only to fail at
  # CR admission — the exact cryptic error this validation prevents. The key
  # is 64 a's: the smallest single-label length the regex must reject.
  - it: "should fail on a 64-char single label (label-cap, not just total length)"
    set:
      kommodity.provider.azure.publicIPAddresses:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {}
    asserts:
      - failedTemplate:
          errorPattern: "invalid PublicIP key \".*\" in kommodity.provider.azure.publicIPAddresses: map keys become the PublicIPAddress resource name and must be valid DNS-1123 subdomains"

  - it: "should fail on a key longer than 253 characters"
    set:
      kommodity.provider.azure.publicIPAddresses:
        aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: {}
    asserts:
      - failedTemplate:
          errorPattern: "invalid PublicIP key \".*\" in kommodity.provider.azure.publicIPAddresses: map keys become the PublicIPAddress resource name and must be valid DNS-1123 subdomains"
