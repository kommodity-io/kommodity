suite: test inline manifest delivery for extra secrets
release:
  name: test-cluster
  namespace: default
templates:
  - templates/*
tests:
  - it: should render inline secret in control plane strategic patch
    template: templates/talos/controlplane.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-inline-secret:
            delivery: InlineManifest
            stringData:
              key: value
    asserts:
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "my-namespace-my-inline-secret"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "kind: Secret"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "inlineManifests"

  - it: should not render CRS resources when all secrets use InlineManifest
    template: templates/extra-secrets.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-inline-secret:
            delivery: InlineManifest
            stringData:
              key: value
    asserts:
      - hasDocuments:
          count: 0

  - it: should render addons and extra secrets in single inlineManifests block
    template: templates/talos/controlplane.yaml
    values:
      - ../values.kubevirt.yaml
      - values.inline-manifest.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-inline-secret:
            delivery: InlineManifest
            stringData:
              key: value
    asserts:
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "external-dns-namespace"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "my-namespace-my-inline-secret"

  - it: should change control plane hash when inline secret content changes
    template: templates/provider/kubevirt/machinetemplate.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-inline-secret:
            delivery: InlineManifest
            stringData:
              key: value
    documentSelector:
      path: metadata.name
      value: test-cluster-controlplane-d35570
    asserts:
      - equal:
          path: kind
          value: KubevirtMachineTemplate

  - it: should produce different CP hash for different inline secret content
    template: templates/provider/kubevirt/machinetemplate.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-inline-secret:
            delivery: InlineManifest
            stringData:
              key: different-value
    documentSelector:
      path: metadata.name
      value: test-cluster-controlplane-bd35e9
    asserts:
      - equal:
          path: kind
          value: KubevirtMachineTemplate

  - it: should not change worker hash when inline secret content changes
    template: templates/provider/kubevirt/machinetemplate.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-inline-secret:
            delivery: InlineManifest
            stringData:
              key: value
    documentSelector:
      path: metadata.name
      value: test-cluster-worker-default-b6586d
    asserts:
      - equal:
          path: kind
          value: KubevirtMachineTemplate

  - it: should fail when inline secret has both data and stringData
    template: templates/provider/kubevirt/machinetemplate.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          bad-secret:
            delivery: InlineManifest
            data:
              key1: dmFsdWUx
            stringData:
              key2: value2
    asserts:
      - failedTemplate:
          errorRegex: "cannot have both 'data' and 'stringData'"

  - it: should render inline secret with data field (base64 encoded)
    template: templates/talos/controlplane.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-data-secret:
            delivery: InlineManifest
            data:
              username: admin
    asserts:
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "data:"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "username:"

  - it: should render inline secret with stringData field
    template: templates/talos/controlplane.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-string-secret:
            delivery: InlineManifest
            stringData:
              key: plaintext-value
    asserts:
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "stringData:"
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "plaintext-value"

  - it: should render inline secret with custom labels
    template: templates/talos/controlplane.yaml
    values:
      - ../values.kubevirt.yaml
    set:
      kommodity.addons.cilium.enabled: false
      kommodity.addons.talos-cluster-proxy.enabled: false
      kommodity.extraSecrets:
        my-namespace:
          my-labeled-secret:
            delivery: InlineManifest
            stringData:
              key: value
            labels:
              my-label: my-label-value
    asserts:
      - matchRegex:
          path: spec.controlPlaneConfig.controlplane.strategicPatches[2]
          pattern: "my-label: my-label-value"
