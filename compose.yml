services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: kommodity
      POSTGRES_PASSWORD: kommodity
      POSTGRES_DB: kommodity
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kommodity-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kommodity -d kommodity"]
      interval: 5s
      timeout: 3s
      retries: 5

  kommodity:
    build:
      context: .
      dockerfile: Containerfile
      args:
        VERSION: ${VERSION:-dev}
    image: kommodity:latest
    restart: always
    environment:
      KOMMODITY_DB_URI: postgres://kommodity:kommodity@postgres:5432/kommodity?sslmode=disable
      KOMMODITY_INSECURE_DISABLE_AUTHENTICATION: true
      KOMMODITY_DEVELOPMENT_MODE: true
      KOMMODITY_BASE_URL: ${KOMMODITY_BASE_URL:-https://localhost:5443}
    networks:
      - kommodity-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - label=disable
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "${CADDY_HOST_PORT:-5443}:${CADDY_HOST_PORT:-5443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - kommodity-net
    depends_on:
      - kommodity

volumes:
  pgdata:

networks:
  kommodity-net:
    driver: bridge
